    inp.className="field nm"; inp.maxLength=14; inp.value=cfg.names[i]||("Team "+"ABCDEF"[i]);
    inp.style.borderColor = TEAM_COLOURS[i]; inp.style.color = TEAM_COLOURS[i];
    const lab = document.createElement("label"); lab.className = "aiTick"; lab.title = "Computer plays this team";
    lab.innerHTML = '<input type="checkbox" data-ai="'+i+'"'+(cfg.ai[i]?" checked":"")+'> 🤖';
    w.append(inp, lab); box.appendChild(w);
  }
}
function syncTitle(){
  $("teamCount").value = cfg.teams; $("aiLevel").value = cfg.aiLevel; $("rounds").value = cfg.rounds;
  buildNames();
}
$("teamCount").addEventListener("change", ()=>{ buildNames(); cfg.teams=+$("teamCount").value; save(); });
$("rounds").addEventListener("change", ()=>{ cfg.rounds=+$("rounds").value; save(); });
$("names").addEventListener("input", ()=>{ [...$("names").querySelectorAll("input.nm")].forEach((i,k)=>cfg.names[k]=i.value); save(); });
$("names").addEventListener("change", e=>{ const t=e.target; if (t.dataset && t.dataset.ai!==undefined){ cfg.ai[+t.dataset.ai]=t.checked; save(); } });
$("aiLevel").addEventListener("change", ()=>{ cfg.aiLevel=$("aiLevel").value; save(); });
syncTitle();

/* ---------- game state ---------- */
const G = {teams:[], cur:0, round:1, rounds:5, d:[6,5,4,3,2], role:[], held:[], left:MAX_ROLLS, phase:"idle", tok:0};
const isAI = () => !!(G.teams[G.cur] && G.teams[G.cur].ai);
function later(fn, ms){ const t=G.tok; setTimeout(()=>{ if (t===G.tok && G.phase!=="over") fn(); }, ms); }
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active", s.id===id)); }
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const qualified = () => G.role.filter(Boolean).length===3;
const cargoIdx = () => [0,1,2,3,4].filter(i=>!G.role[i]);
const cargoSum = () => cargoIdx().reduce((a,i)=>a+G.d[i],0);

function startGame(){
  [...$("names").querySelectorAll("input.nm")].forEach((i,k)=>cfg.names[k]=i.value.trim()||("Team "+"ABCDEF"[k]));
  cfg.teams = +$("teamCount").value; cfg.rounds = +$("rounds").value; cfg.aiLevel = $("aiLevel").value; save();
  const nAI = cfg.ai.slice(0,cfg.teams).filter(Boolean).length; let aiN = 0;
  G.teams = Array.from({length:cfg.teams}, (_,i)=>{
    const ai = !!cfg.ai[i]; let name = cfg.names[i];
    if (ai && name==="Team "+"ABCDEF"[i]) name = nAI>1 ? "Computer "+(++aiN) : "Computer";
    return {name, score:0, colour:TEAM_COLOURS[i], ai, last:""};
  });
  G.cur = 0; G.round = 1; G.rounds = cfg.rounds; G.tok++; G.phase = "idle";
  buildScoreboard(); show("game"); newTurn();
}
$("startBtn").addEventListener("click", startGame);

function buildScoreboard(){
  const sb = $("scoreboard"); sb.innerHTML = "";
  G.teams.forEach((t,i)=>{
    const d = document.createElement("div");
    d.className = "team"; d.id = "team"+i; d.style.setProperty("--tc", t.colour);
    d.innerHTML = `<div class="row"><div class="name">${esc(t.name)}</div><div class="score" id="score${i}">0</div></div><div class="tag" id="tag${i}"></div>`;
    sb.appendChild(d);
    if (i===0 && G.teams.length===2){
      const c = document.createElement("div"); c.className="centreInfo";
      c.innerHTML = `<div class="t1">🚢 Voyage <span id="rnd">1</span>/${G.rounds}</div><div class="t2">Most cargo wins</div>`;
      sb.appendChild(c);
    }
  });
  renderScores();
}
function renderScores(){
  G.teams.forEach((t,i)=>{
    $("score"+i).textContent = t.score;
    $("tag"+i).textContent = t.last ? "Last: " + t.last : (t.ai ? "🤖 Computer · " + cfg.aiLevel : "");
    $("team"+i).classList.toggle("active", i===G.cur);
  });
  if ($("rnd")) $("rnd").textContent = G.round;
}

function setMessage(text, cls){
  const m = $("message"); m.className = "message"; void m.offsetWidth;
  if (cls) m.classList.add(cls); m.textContent = text;
}
function setButtons({roll=false,stop=false,next=false}){
  $("rollBtn").classList.toggle("hidden",!roll);
  $("stopBtn").classList.toggle("hidden",!stop);
  $("nextBtn").classList.toggle("hidden",!next);
  $("rollBtn").disabled = $("stopBtn").disabled = $("nextBtn").disabled = false;
}

/* ---------- drawing the dice ---------- */
function render(ghost){
  const row = $("diceRow"); row.innerHTML = "";
  const canHold = !ghost && G.phase==="choose" && qualified() && !isAI();
  G.d.forEach((v,i)=>{
    const d = makeDie(); showFace(d, v); d.dataset.i = i;
    const lab = document.createElement("div"); lab.className = "lab";
    if (ghost) d.classList.add("ghost");
    else if (G.role[i]){ d.classList.add("locked"); lab.textContent = ROLE_ICON[G.role[i]] + " " + ROLE_NAME[G.role[i]]; }
    else if (qualified()){
      lab.textContent = G.held[i] ? "Kept" : "Cargo";
      if (G.held[i]) d.classList.add("held");
      if (canHold) d.classList.add("pickable");
    }
    d.appendChild(lab); row.appendChild(d);
  });
  $("cargo").textContent = (!ghost && qualified()) ? cargoSum() : "–";
  $("rollsLeft").textContent = G.left;
}

function newTurn(){
  const t = G.teams[G.cur];
  G.d = [6,5,4,3,2]; G.role = [null,null,null,null,null]; G.held = [false,false,false,false,false];
  G.left = MAX_ROLLS; G.phase = "start";
  renderScores();
  const lbl = $("turnLabel"); lbl.style.color = t.colour;
  lbl.textContent = t.name + "'s turn" + (G.teams.length>2 ? "  ·  Voyage " + G.round + " of " + G.rounds : "");
  render(true);
  setMessage("Find your Ship (6), Captain (5) and Crew (4)", "dim");
  $("rollBtn").textContent = "🎲 Roll 5 dice";
  setButtons({roll:true});
  if (t.ai){ setButtons({}); later(()=>roll(true), 1100); }
}

/* ---------- rolling ---------- */
function freeDice(){ return [0,1,2,3,4].filter(i=>!G.role[i] && !G.held[i]); }

function roll(viaAI){
  if (isAI() && viaAI!==true) return;
  if (G.phase!=="start" && G.phase!=="choose") return;
  const free = freeDice(); if (!free.length || G.left<=0) return;
  G.phase = "rolling";
  $("rollBtn").disabled = $("stopBtn").disabled = true;
  setMessage("", "");
  const results = {}; free.forEach(i=>results[i]=rnd());
  G.held = [false,false,false,false,false];
  G.d = G.d.slice();
  // show the dice as they stand, then tumble the free ones
  render(false);
  const els = [...$("diceRow").children];
  free.forEach(i=>{ els[i].classList.remove("held","pickable","land"); els[i].classList.add("rolling"); });
  let f = 0;
  const flick = () => {
    f++;
    free.forEach(i=>showFace(els[i], rnd())); sfx.tick();
    if (f < 14) setTimeout(flick, 40 + f*6);
    else {
      if (G.phase==="over") return;
      free.forEach(i=>{ G.d[i] = results[i]; });
      afterRoll(free);
    }
  };
  flick();
}

function afterRoll(rolled){
  G.left--;
  // lock Ship, then Captain, then Crew, as they turn up
  const found = [];
  for (const [name,face] of ORDER){
    if (G.role.includes(name)) continue;
    const prev = ORDER[ORDER.findIndex(o=>o[0]===name)-1];
    if (prev && !G.role.includes(prev[0])) break;
    const i = rolled.find(k=>!G.role[k] && G.d[k]===face);
    if (i===undefined) break;
    G.role[i] = name; found.push(name);
  }
  render(false);
  [...$("diceRow").children].forEach((d,i)=>{ if (rolled.includes(i)){ void d.offsetWidth; d.classList.add("land"); } });
  if (found.length){ sfx.lock(); if (qualified()) sfx.hot(); }

  if (qualified()){
    const crewNow = found.includes("crew");
    if (G.left===0) return endTurn();
    G.phase = "choose";
    $("rollBtn").textContent = "🎲 Roll again (" + G.left + " left)";
    $("stopBtn").textContent = "⛵ Set sail with " + cargoSum();
    setButtons({roll:true, stop:true});
    render(false);
    setMessage(crewNow ? "All aboard! Cargo " + cargoSum() + ". Keep it or roll again?" : "Cargo " + cargoSum() + ". Keep it or roll again?", "good");
    if (!isAI()) updateHoldUI();
    else { setButtons({}); later(aiAct, 1100); }
    return;
  }
  // not yet qualified
  if (G.left===0) return endTurn();
  G.phase = "choose";
  const need = ORDER.filter(o=>!G.role.includes(o[0])).map(o=>ROLE_NAME[o[0]]+" ("+o[1]+")")[0];
  setMessage((found.length ? found.map(f=>ROLE_ICON[f]+" "+ROLE_NAME[f]+"! ").join("") : "") + "Still need the " + need, found.length ? "good" : "warn");
  $("rollBtn").textContent = "🎲 Roll again (" + G.left + " left)";
  setButtons({roll:true});
  if (isAI()){ setButtons({}); later(()=>roll(true), 1100); }
}

/* ---------- keeping cargo dice ---------- */
$("diceRow").addEventListener("click", e=>{
  const d = e.target.closest(".die"); if (d) toggleHold(+d.dataset.i);
});
function toggleHold(i){
  if (isAI() || G.phase!=="choose" || !qualified() || G.role[i] || i>4 || i<0) return;
  G.held[i] = !G.held[i]; sfx.pick();
  render(false); updateHoldUI();
}
function updateHoldUI(){
  const free = freeDice().length;
  $("rollBtn").disabled = free===0;
  if (free===0) setMessage("Keep both? Set sail, or release one to roll it", "warn");
  else if (free<cargoIdx().length) setMessage("Rolling " + free + " cargo " + (free===1?"die":"dice") + ", keeping the rest", "dim");
  else setMessage("Cargo " + cargoSum() + ". Tap cargo dice to keep them.", "good");
}

function stop(viaAI){
  if (isAI() && viaAI!==true) return;
  if (G.phase!=="choose" || !qualified()) return;
  endTurn();
}

/* ---------- end of a turn ---------- */
function endTurn(){
  G.phase = "ended";
  const t = G.teams[G.cur];
  const got = qualified() ? cargoSum() : 0;
  render(false);
  [...$("diceRow").children].forEach(d=>d.classList.remove("pickable","held"));
  t.last = qualified() ? String(got) : "no crew";
  if (qualified()){
    sfx.bank();
    setMessage("⛵ Cargo delivered: " + got + "!", "good");
  } else {
    sfx.bad();
    const have = G.role.filter(Boolean).length;
    setMessage(have===0 ? "Lost at sea! 0" : "Not enough crew! 0", "bad");
  }
  const ts = $("cargo"); ts.classList.add("pop"); setTimeout(()=>ts.classList.remove("pop"),200);
  $("rollsLeft").textContent = G.left;
  countTo(G.cur, t.score + got);
  const last = G.cur===G.teams.length-1 && G.round===G.rounds;
  $("nextBtn").textContent = last ? "See result ➜" : "Next team ➜";
  setButtons({next:true});
  if (t.ai){ setButtons({}); later(advance, 2000); }
}

function countTo(i, value, done){
  const t = G.teams[i], start = t.score, el = $("score"+i);
  t.score = value;
  const steps = Math.min(15, Math.abs(value-start)) || 1;
  let k = 0; el.classList.add("bump");
  const step = () => {
    k++; el.textContent = Math.round(start + (value-start)*k/steps);
    if (k<steps) setTimeout(step, 40);
    else { el.classList.remove("bump"); renderScores(); done && done(); }
  };
  step();
}

function advance(){
  if (G.phase==="over") return;
  G.cur++;
  if (G.cur>=G.teams.length){
    G.cur = 0; G.round++;
    if (G.round>G.rounds){ G.round = G.rounds; return declareResult("final"); }
  }
  newTurn();
}
function nextTeam(){ if (G.phase==="ended" && !isAI()) advance(); }

/* ---------- result ---------- */
function declareResult(reason){
  G.phase = "over";
  const top = Math.max(...G.teams.map(t=>t.score));
  const winners = G.teams.filter(t=>t.score===top);
  sfx.win();
  const title = $("winTitle");
  if (winners.length>1){ title.textContent = "🤝 It's a draw!"; title.style.color = "var(--chalk)"; }
  else { title.textContent = "🏆 " + winners[0].name + " wins!"; title.style.color = winners[0].colour; }
  $("winNote").textContent = reason==="early" ? "Game ended early: most points wins." : "";
  const sorted = [...G.teams].sort((a,b)=>b.score-a.score);
  $("resultTable").innerHTML = sorted.map(t=>`<tr><td style="color:${t.colour}">${esc(t.name)}</td><td>${t.score}</td></tr>`).join("");
  $("winOverlay").classList.add("show");
  confetti();
}

function confetti(){
  const c=$("confetti"), ctx=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const bits = Array.from({length:180}, ()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:8+Math.random()*8,h:5+Math.random()*6,col:TEAM_COLOURS[Math.random()*6|0]}));
  let f=0;
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    bits.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.vy+=.04; b.r+=b.vr; ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r); ctx.fillStyle=b.col; ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h); ctx.restore(); });
    if (++f<260) requestAnimationFrame(draw); else ctx.clearRect(0,0,c.width,c.height);
  })();
}

/* ---------- computer players ---------- */
// Re-rolling a cargo die can never lose the Ship, Captain or Crew, so the only question is
// whether the average new roll (3.5) beats the die you are holding.
function aiAct(){
  if (G.phase!=="choose" || !isAI() || !qualified()) return;
  const lvl = cfg.aiLevel, idx = cargoIdx(), sum = cargoSum();
  let reroll = [];
  if (lvl==="easy"){
    if (sum>=6 && Math.random()<0.6) return stop(true);
    reroll = idx;                                     // throws both cargo dice again
  } else {
    reroll = idx.filter(i=>G.d[i]<=3);                // keep 4, 5, 6
    if (!reroll.length) return stop(true);
    if (lvl==="medium" && sum>=8 && Math.random()<0.3) return stop(true);
  }
  idx.forEach(i=>{ G.held[i] = !reroll.includes(i); });
  render(false);
  later(()=>roll(true), 900);
}

/* ---------- wiring ---------- */
$("rollBtn").addEventListener("click", ()=>roll());
$("stopBtn").addEventListener("click", ()=>stop());
$("nextBtn").addEventListener("click", nextTeam);
$("menuBtn").addEventListener("click", ()=>{ if (confirm("Leave this game and return to the menu?")){ G.phase="over"; G.tok++; syncTitle(); show("menu"); } });
$("endBtn").addEventListener("click", ()=>{ if (G.phase!=="over" && confirm("End the game now? The team with the most points wins.")){ G.tok++; declareResult("early"); } });
$("rulesBtn").addEventListener("click", ()=>$("rulesOverlay").classList.add("show"));
$("closeRules").addEventListener("click", ()=>$("rulesOverlay").classList.remove("show"));
$("againBtn").addEventListener("click", ()=>{ $("winOverlay").classList.remove("show"); startGame(); });
$("winMenuBtn").addEventListener("click", ()=>{ $("winOverlay").classList.remove("show"); syncTitle(); show("menu"); });
$("soundBtn").addEventListener("click", ()=>{
  soundOn = !soundOn;
  $("soundBtn").innerHTML = soundOn ? '<span class="ic">🔊</span><span class="tx"> Sound on</span>' : '<span class="ic">🔇</span><span class="tx"> Sound off</span>';
});

// Keyboard: Space/R roll, S set sail, 1–5 keep a cargo die, N/Enter next team
document.addEventListener("keydown", e=>{
  if (!$("game").classList.contains("active") || e.target.tagName==="INPUT") return;
  if (document.querySelector(".overlay.show")) return;
  const k = e.key.toLowerCase();
  if (k>="1" && k<="5") toggleHold(+k-1);
  else if (k===" " || k==="r"){ e.preventDefault(); roll(); }
  else if (k==="s") stop();
  else if (k==="n" || k==="enter") nextTeam();
});

/* ---------- Dice Games hub link ---------- */
try{
  if (window.parent !== window && window.parent.DiceHub){
    const hb = document.getElementById("hubBack");
    hb.classList.remove("hidden");
    hb.addEventListener("click", ()=>window.parent.DiceHub.home());
  }
}catch(e){}
})();
</script>
</template>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const TEAM_COLOURS = ["#ffd166","#7fd1ff","#ff9ecd","#8ce99a","#c9a7ff","#ffa66b"];

/* ---------- settings ---------- */
const DEFAULTS = {teams:2, names:["Team A","Team B","Team C","Team D","Team E","Team F"], ai:[false,false,false,false,false,false], aiLevel:"medium", rounds:3, tiles:9, oneDie:true};
const KEY = "stb-settings-v1";
let cfg = JSON.parse(JSON.stringify(DEFAULTS));
try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if (s) Object.assign(cfg, s); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(cfg)); }catch(e){} };

/* ---------- dice ---------- */
const FACES = {1:[4],2:[2,6],3:[2,4,6],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function makeDie(){
  const d = document.createElement("div"); d.className = "die";
  for (let i=0;i<9;i++){ const p=document.createElement("div"); p.className="pip"; d.appendChild(p); }
  return d;
}
function showFace(die,n){
  const lit = FACES[n];
  [...die.querySelectorAll(".pip")].forEach((p,i)=>p.classList.toggle("on", lit.includes(i)));
  die.classList.toggle("one", n===1);
}
const rnd = () => 1 + Math.floor(Math.random()*6);
for (let i=1;i<=9;i++){ const t=document.createElement("div"); t.className="tile"; t.textContent=i; $("titleTiles").appendChild(t); }

/* ---------- sound ---------- */
let soundOn = true, actx = null;
function tone(freq,dur,type="sine",vol=.15,delay=0){
  if (!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime+delay, o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
const sfx = {
  tick:()=>tone(700+Math.random()*500,.04,"square",.05),
  pick:()=>tone(880,.06,"triangle",.08),
  shut:()=>{ tone(260,.08,"square",.1); tone(180,.14,"square",.1,.07); },
  bank:()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,.15,"triangle",.14,i*.08)); },
  bad:()=>{ tone(300,.2,"sawtooth",.12); tone(180,.4,"sawtooth",.12,.18); },
  win:()=>{ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.2,"triangle",.15,i*.13)); }
};

/* ---------- title screen ---------- */
function buildNames(){
  const n = +$("teamCount").value, box = $("names");
  [...box.querySelectorAll("input.nm")].forEach((inp,i)=>cfg.names[i]=inp.value);
  box.innerHTML = "";
  for (let i=0;i<n;i++){
    const w = document.createElement("span"); w.className = "nameWrap";
    const inp = document.createElement("input");
    inp.className="field nm"; inp.maxLength=14; inp.value=cfg.names[i]||("Team "+"ABCDEF"[i]);
    inp.style.borderColor = TEAM_COLOURS[i]; inp.style.color = TEAM_COLOURS[i];
    const lab = document.createElement("label"); lab.className = "aiTick"; lab.title = "Computer plays this team";
    lab.innerHTML = '<input type="checkbox" data-ai="'+i+'"'+(cfg.ai[i]?" checked":"")+'> 🤖';
    w.append(inp, lab); box.appendChild(w);
  }
}
function syncTitle(){
  $("teamCount").value = cfg.teams; $("aiLevel").value = cfg.aiLevel; $("rounds").value = cfg.rounds;
  $("tileCount").value = cfg.tiles; $("oneDie").checked = cfg.oneDie;
  buildNames();
}
$("teamCount").addEventListener("change", ()=>{ buildNames(); cfg.teams=+$("teamCount").value; save(); });
$("rounds").addEventListener("change", ()=>{ cfg.rounds=+$("rounds").value; save(); });
$("tileCount").addEventListener("change", ()=>{ cfg.tiles=+$("tileCount").value; save(); });
$("oneDie").addEventListener("change", ()=>{ cfg.oneDie=$("oneDie").checked; save(); });
$("names").addEventListener("input", ()=>{ [...$("names").querySelectorAll("input.nm")].forEach((i,k)=>cfg.names[k]=i.value); save(); });
$("names").addEventListener("change", e=>{ const t=e.target; if (t.dataset && t.dataset.ai!==undefined){ cfg.ai[+t.dataset.ai]=t.checked; save(); } });
$("aiLevel").addEventListener("change", ()=>{ cfg.aiLevel=$("aiLevel").value; save(); });
syncTitle();

/* ---------- maths helpers ---------- */
const P2 = [0,0,1,2,3,4,5,6,5,4,3,2,1].map(x=>x/36);      // chance of each total with two dice
function canMake(open, total){                              // can some open tiles add to total?
  let r = 1;
  for (const v of open) r = (r | (r << v)) & 0x1FFF;
  return ((r >> total) & 1) === 1;
}
function subsets(open, total){                              // every set of open tiles adding to total
  const out = [];
  (function rec(i, left, cur){
    if (left===0){ out.push(cur.slice()); return; }
    for (let k=i;k<open.length;k++){
      if (open[k] > left) break;
      cur.push(open[k]); rec(k+1, left-open[k], cur); cur.pop();
    }
  })(0, total, []);
  return out;
}
const oneDieOK = open => cfg.oneDie && open.length>0 && open.every(v=>v<7);
function nextProb(open){
  if (!open.length) return 2;
  let p = 0;
  if (oneDieOK(open)){ for (let t=1;t<=6;t++) if (canMake(open,t)) p += 1/6; }
  else for (let t=2;t<=12;t++) if (canMake(open,t)) p += P2[t];
  return p;
}

/* ---------- game state ---------- */
const G = {teams:[], cur:0, round:1, rounds:3, n:9, open:[], sel:new Set(), dice:[], total:0, phase:"idle", tok:0};
const isAI = () => !!(G.teams[G.cur] && G.teams[G.cur].ai);
const openList = () => { const a=[]; for (let i=1;i<=G.n;i++) if (G.open[i]) a.push(i); return a; };
const selSum = () => [...G.sel].reduce((a,b)=>a+b,0);
function later(fn, ms){ const t=G.tok; setTimeout(()=>{ if (t===G.tok && G.phase!=="over") fn(); }, ms); }
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active", s.id===id)); }
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function startGame(){
  [...$("names").querySelectorAll("input.nm")].forEach((i,k)=>cfg.names[k]=i.value.trim()||("Team "+"ABCDEF"[k]));
  cfg.teams = +$("teamCount").value; cfg.rounds = +$("rounds").value; cfg.aiLevel = $("aiLevel").value;
  cfg.tiles = +$("tileCount").value; cfg.oneDie = $("oneDie").checked; save();
  const nAI = cfg.ai.slice(0,cfg.teams).filter(Boolean).length; let aiN = 0;
  G.teams = Array.from({length:cfg.teams}, (_,i)=>{
    const ai = !!cfg.ai[i]; let name = cfg.names[i];
    if (ai && name==="Team "+"ABCDEF"[i]) name = nAI>1 ? "Computer "+(++aiN) : "Computer";
    return {name, score:0, colour:TEAM_COLOURS[i], ai, last:""};
  });
  G.cur = 0; G.round = 1; G.rounds = cfg.rounds; G.n = cfg.tiles; G.tok++; G.phase = "idle";
  buildScoreboard(); show("game"); newTurn();
}
$("startBtn").addEventListener("click", startGame);

function buildScoreboard(){
  const sb = $("scoreboard"); sb.innerHTML = "";
  G.teams.forEach((t,i)=>{
    const d = document.createElement("div");
    d.className = "team"; d.id = "team"+i; d.style.setProperty("--tc", t.colour);
    d.innerHTML = `<div class="row"><div class="name">${esc(t.name)}</div><div class="score" id="score${i}">0</div></div><div class="tag" id="tag${i}"></div>`;
    sb.appendChild(d);
    if (i===0 && G.teams.length===2){
      const c = document.createElement("div"); c.className="centreInfo";
      c.innerHTML = `<div class="t1">📦 Round <span id="rnd">1</span>/${G.rounds}</div><div class="t2">Lowest score wins</div>`;
      sb.appendChild(c);
    }
  });
  renderScores();
}
function renderScores(){
  G.teams.forEach((t,i)=>{
    $("score"+i).textContent = t.score;
    $("tag"+i).textContent = t.last ? "Last: " + t.last : (t.ai ? "🤖 Computer · " + cfg.aiLevel : "");
    $("team"+i).classList.toggle("active", i===G.cur);
  });
  if ($("rnd")) $("rnd").textContent = G.round;
}
function setMessage(text, cls){
  const m = $("message"); m.className = "message"; void m.offsetWidth;
  if (cls) m.classList.add(cls); m.textContent = text;
}
function setButtons({roll=false,next=false}){
  $("rollBtn").classList.toggle("hidden",!roll);
  $("nextBtn").classList.toggle("hidden",!next);
  $("rollBtn").disabled = $("nextBtn").disabled = false;
}

/* ---------- drawing ---------- */
function renderTiles(){
  const box = $("tiles"); box.innerHTML = "";
  const canPick = G.phase==="choose" && !isAI();
  for (let i=1;i<=G.n;i++){
    const b = document.createElement("button");
    b.className = "tile" + (G.open[i] ? "" : " shut") + (G.sel.has(i) ? " sel" : "") + (G.open[i] && canPick ? " pickable" : "");
    b.dataset.n = i; b.textContent = i; b.setAttribute("aria-label", "Tile " + i);
    box.appendChild(b);
  }
  $("openSum").textContent = openList().reduce((a,b)=>a+b,0);
  $("chosen").textContent = G.sel.size ? selSum() : "0";
}
function renderDice(n, ghost){
  const row = $("diceRow"); row.innerHTML = "";
  for (let i=0;i<n;i++){
    const d = makeDie(); showFace(d, ghost ? [4,3][i] : G.dice[i]);
    if (ghost) d.classList.add("ghost");
    row.appendChild(d);
  }
}

function newTurn(){
  const t = G.teams[G.cur];
  G.open = [false]; for (let i=1;i<=G.n;i++) G.open.push(true);
  G.sel = new Set(); G.dice = []; G.total = 0; G.phase = "start";
  renderScores(); renderTiles(); renderDice(2, true);
  const lbl = $("turnLabel"); lbl.style.color = t.colour;
  lbl.textContent = t.name + "'s turn" + (G.teams.length!==2 ? "  ·  Round " + G.round + " of " + G.rounds : "");
  $("rolled").textContent = "–";
  setMessage("Roll the dice, then shut tiles that add up to your total", "dim");
  $("rollBtn").textContent = "🎲 Roll";
  setButtons({roll:true});
  if (t.ai){ setButtons({}); later(()=>roll(true), 1100); }
}

/* ---------- rolling ---------- */
function roll(viaAI){
  if (isAI() && viaAI!==true) return;
  if (G.phase!=="start" && G.phase!=="needRoll") return;
  G.phase = "rolling";
  $("rollBtn").disabled = true; setMessage("", ""); G.sel = new Set();
  const n = oneDieOK(openList()) ? 1 : 2;
  G.dice = Array.from({length:n}, rnd);
  renderTiles(); renderDice(n, false);
  $("rolled").textContent = "–";
  const els = [...$("diceRow").children];
  els.forEach(d=>d.classList.add("rolling"));
  let f = 0;
  const flick = () => {
    f++;
    els.forEach(d=>showFace(d, rnd())); sfx.tick();
    if (f < 14) setTimeout(flick, 40 + f*6);
    else {
      if (G.phase==="over") return;
      els.forEach((d,i)=>{ d.classList.remove("rolling"); showFace(d, G.dice[i]); void d.offsetWidth; d.classList.add("land"); });
      afterRoll();
    }
  };
  flick();
}

function afterRoll(){
  G.total = G.dice.reduce((a,b)=>a+b,0);
  const rb = $("rolled"); rb.textContent = G.total; rb.classList.add("pop"); setTimeout(()=>rb.classList.remove("pop"),200);
  const open = openList();
  if (!canMake(open, G.total)){ return endTurn(false); }
  G.phase = "choose";
  renderTiles();
  setButtons({});
  if (isAI()){ setMessage("Shut tiles adding to " + G.total, "good"); later(aiAct, 1000); }
  else setMessage("Tap tiles that add up to " + G.total, "good");
}

/* ---------- choosing tiles ---------- */
$("tiles").addEventListener("click", e=>{
  const b = e.target.closest(".tile"); if (b) toggleTile(+b.dataset.n);
});
function toggleTile(n){
  if (isAI() || G.phase!=="choose" || n<1 || n>G.n || !G.open[n]) return;
  if (G.sel.has(n)) G.sel.delete(n);
  else {
    if (selSum() + n > G.total){
      sfx.bad();
      const el = $("tiles").querySelector('[data-n="'+n+'"]');
      if (el){ el.classList.remove("nudge"); void el.offsetWidth; el.classList.add("nudge"); }
      setMessage("That makes more than " + G.total, "warn");
      return;
    }
    G.sel.add(n);
  }
  sfx.pick(); renderTiles();
  const s = selSum();
  if (s===G.total){ G.phase = "locking"; setMessage("Shut!", "good"); later(shutSelected, 450); }
  else setMessage(G.sel.size ? "Chosen " + s + ", need " + (G.total-s) + " more" : "Tap tiles that add up to " + G.total, "dim");
}

function shutSelected(){
  G.sel.forEach(n=>{ G.open[n] = false; });
  G.sel = new Set(); sfx.shut();
  renderTiles();
  if (!openList().length) return endTurn(true);
  G.phase = "needRoll";
  $("rollBtn").textContent = oneDieOK(openList()) ? "🎲 Roll one die" : "🎲 Roll again";
  setMessage("Roll again", "dim");
  $("rolled").textContent = G.total;
  if (isAI()){ setButtons({}); later(()=>roll(true), 900); }
  else setButtons({roll:true});
}

/* ---------- end of a turn ---------- */
function endTurn(boxShut){
  G.phase = "ended";
  const t = G.teams[G.cur];
  const pts = openList().reduce((a,b)=>a+b,0);
  t.last = String(pts);
  renderTiles();
  if (boxShut){ sfx.bank(); setMessage("🎉 SHUT THE BOX! 0 points", "good"); }
  else { sfx.bad(); setMessage("No tiles fit! You score " + pts, "bad"); }
  countTo(G.cur, t.score + pts);
  const last = G.cur===G.teams.length-1 && G.round===G.rounds;
  $("nextBtn").textContent = last ? "See result ➜" : (G.teams.length===1 ? "Next round ➜" : "Next team ➜");
  setButtons({next:true});
  if (t.ai){ setButtons({}); later(advance, 2200); }
}
function countTo(i, value){
  const t = G.teams[i], start = t.score, el = $("score"+i);
  t.score = value;
  const steps = Math.min(15, Math.abs(value-start)) || 1;
  let k = 0; el.classList.add("bump");
  const step = () => {
    k++; el.textContent = Math.round(start + (value-start)*k/steps);
    if (k<steps) setTimeout(step, 40);
    else { el.classList.remove("bump"); renderScores(); }
  };
  step();
}
function advance(){
  if (G.phase==="over") return;
  G.cur++;
  if (G.cur>=G.teams.length){
    G.cur = 0; G.round++;
    if (G.round>G.rounds){ G.round = G.rounds; return declareResult("final"); }
  }
  newTurn();
}
function nextTeam(){ if (G.phase==="ended" && !isAI()) advance(); }

/* ---------- result ---------- */
function declareResult(reason){
  G.phase = "over";
  const low = Math.min(...G.teams.map(t=>t.score));
  const winners = G.teams.filter(t=>t.score===low);
  sfx.win();
  const title = $("winTitle");
  if (G.teams.length===1){ title.textContent = "Final score: " + low; title.style.color = "var(--gold)"; }
  else if (winners.length>1){ title.textContent = "🤝 It's a draw!"; title.style.color = "var(--chalk)"; }
  else { title.textContent = "🏆 " + winners[0].name + " wins!"; title.style.color = winners[0].colour; }
  $("winNote").textContent = (reason==="early" ? "Game ended early. " : "") + "Lowest score wins.";
  const sorted = [...G.teams].sort((a,b)=>a.score-b.score);
  $("resultTable").innerHTML = sorted.map(t=>`<tr><td style="color:${t.colour}">${esc(t.name)}</td><td>${t.score}</td></tr>`).join("");
  $("winOverlay").classList.add("show");
  if (G.teams.length>1 || low===0) confetti();
}
function confetti(){
  const c=$("confetti"), ctx=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const bits = Array.from({length:180}, ()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:8+Math.random()*8,h:5+Math.random()*6,col:TEAM_COLOURS[Math.random()*6|0]}));
  let f=0;
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    bits.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.vy+=.04; b.r+=b.vr; ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r); ctx.fillStyle=b.col; ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h); ctx.restore(); });
    if (++f<260) requestAnimationFrame(draw); else ctx.clearRect(0,0,c.width,c.height);
  })();
}

/* ---------- computer players ---------- */
function aiAct(){
  if (G.phase!=="choose" || !isAI()) return;
  const open = openList(), subs = subsets(open, G.total), lvl = cfg.aiLevel;
  if (!subs.length) return;
  let pick;
  if (lvl==="easy") pick = subs[Math.floor(Math.random()*subs.length)];
  else if (lvl==="medium"){
    // like most people: get rid of the biggest tile you can
    const top = Math.max(...subs.map(s=>Math.max(...s)));
    const c = subs.filter(s=>s.includes(top));
    pick = c[Math.floor(Math.random()*c.length)];
  } else {
    // hard: leave the tiles that are most likely to be playable on the next roll
    let best = -1;
    subs.forEach(s=>{
      const rest = open.filter(v=>!s.includes(v));
      const v = nextProb(rest)*1000 + Math.max(...s);
      if (v>best){ best=v; pick=s; }
    });
  }
  G.sel = new Set(pick); G.phase = "locking";
  sfx.pick(); renderTiles();
  later(shutSelected, 800);
}

/* ---------- rules ---------- */
function rulesHTML(){
  const top = G.n || cfg.tiles;
  return `<li>The box has tiles numbered <b>1 to ${top}</b>, all open.</li>
    <li>Roll <b>two dice</b>. Add them up.</li>
    <li>Shut any open tiles that add up to your total. For a 9, you could shut 9, or 4 and 5, or 2, 3 and 4.</li>
    <li>Roll again, and keep going until you <b>can't</b> shut any tiles that fit.</li>
    ${cfg.oneDie ? `<li>Once every tile from <b>7 up</b> is shut, you roll just <b>one die</b>.</li>` : ""}
    <li>When you get stuck, your score is the <b>total of the tiles still open</b>. Lower is better.</li>
    <li>Shut every tile and you've <b>shut the box</b>: a perfect score of <b>0</b>.</li>
    <li>After ${G.rounds||cfg.rounds} round${(G.rounds||cfg.rounds)===1?"":"s"}, the lowest total wins.</li>
    <li><b>End game</b> finishes early: the lowest score wins.</li>`;
}

/* ---------- wiring ---------- */
$("rollBtn").addEventListener("click", ()=>roll());
$("nextBtn").addEventListener("click", nextTeam);
$("menuBtn").addEventListener("click", ()=>{ if (confirm("Leave this game and return to the menu?")){ G.phase="over"; G.tok++; syncTitle(); show("menu"); } });
$("endBtn").addEventListener("click", ()=>{ if (G.phase!=="over" && confirm("End the game now? The lowest score wins.")){ G.tok++; declareResult("early"); } });
$("rulesBtn").addEventListener("click", ()=>{ $("rulesList").innerHTML = rulesHTML(); $("rulesOverlay").classList.add("show"); });
$("closeRules").addEventListener("click", ()=>$("rulesOverlay").classList.remove("show"));
$("againBtn").addEventListener("click", ()=>{ $("winOverlay").classList.remove("show"); startGame(); });
$("winMenuBtn").addEventListener("click", ()=>{ $("winOverlay").classList.remove("show"); syncTitle(); show("menu"); });
$("soundBtn").addEventListener("click", ()=>{
  soundOn = !soundOn;
  $("soundBtn").innerHTML = soundOn ? '<span class="ic">🔊</span><span class="tx"> Sound on</span>' : '<span class="ic">🔇</span><span class="tx"> Sound off</span>';
});

// Keyboard: 1-9 tiles (0, -, = for 10, 11, 12), Space/R roll, N/Enter next team
document.addEventListener("keydown", e=>{
  if (!$("game").classList.contains("active") || e.target.tagName==="INPUT") return;
  if (document.querySelector(".overlay.show")) return;
  const k = e.key.toLowerCase();
  if (k>="1" && k<="9") toggleTile(+k);
  else if (k==="0") toggleTile(10);
  else if (k==="-") toggleTile(11);
  else if (k==="=") toggleTile(12);
  else if (k===" " || k==="r"){ e.preventDefault(); roll(); }
  else if (k==="n" || k==="enter") nextTeam();
});

/* ---------- Dice Games hub link ---------- */
try{
  if (window.parent !== window && window.parent.DiceHub){
    const hb = document.getElementById("hubBack");
    hb.classList.remove("hidden");
    hb.addEventListener("click", ()=>window.parent.DiceHub.home());
  }
}catch(e){}
})();
</script>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const TEAM_COLOURS = ["#ffd166","#7fd1ff","#ff9ecd","#8ce99a","#c9a7ff","#ffa66b"];

/* ---------- categories & scoring ---------- */
const CATS = [
  {name:"Ones"},{name:"Twos"},{name:"Threes"},{name:"Fours"},{name:"Fives"},{name:"Sixes"},
  {name:"Full House",tip:"Three of one number and two of another: total of all dice"},
  {name:"Four of a Kind",tip:"At least four the same: total of all dice"},
  {name:"Little Straight",tip:"1-2-3-4-5: 30 points"},
  {name:"Big Straight",tip:"2-3-4-5-6: 30 points"},
  {name:"Choice",tip:"Any dice: total of all dice"},
  {name:"Yacht",tip:"All five the same: 50 points"}
];
function score(ci, dice){
  const c = [0,0,0,0,0,0,0]; let s = 0;
  dice.forEach(v=>{ c[v]++; s += v; });
  const mx = Math.max(...c);
  if (ci<6) return (ci+1)*c[ci+1];
  switch(ci){
    case 6: return (c.includes(3) && c.includes(2)) ? s : 0;
    case 7: return mx>=4 ? s : 0;
    case 8: return [1,2,3,4,5].every(v=>c[v]===1) ? 30 : 0;
    case 9: return [2,3,4,5,6].every(v=>c[v]===1) ? 30 : 0;
    case 10: return s;
    case 11: return mx===5 ? 50 : 0;
  }
  return 0;
}

/* ---------- settings ---------- */
const DEFAULTS = {teams:2, names:["Team A","Team B","Team C","Team D","Team E","Team F"], ai:[false,false,false,false,false,false], aiLevel:"medium"};
const KEY = "yacht-settings-v1";
let cfg = JSON.parse(JSON.stringify(DEFAULTS));
try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if (s) Object.assign(cfg, s); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(cfg)); }catch(e){} };

/* ---------- dice ---------- */
const FACES = {1:[4],2:[2,6],3:[2,4,6],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function makeDie(){
  const d = document.createElement("div"); d.className = "die";
  for (let i=0;i<9;i++){ const p=document.createElement("div"); p.className="pip"; d.appendChild(p); }
  return d;
}
function showFace(die,n){
  const lit = FACES[n];
  [...die.querySelectorAll(".pip")].forEach((p,i)=>p.classList.toggle("on", lit.includes(i)));
  die.classList.toggle("one", n===1);
}

[6,6,6,6,6].forEach(v=>{ const d=makeDie(); d.style.width="56px"; d.style.padding="8px"; showFace(d,v); $("titleDice").appendChild(d); });

/* ---------- sound ---------- */
let soundOn = true, actx = null;
function tone(freq,dur,type="sine",vol=.15,delay=0){
  if (!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime+delay, o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
const sfx = {
  tick:()=>tone(700+Math.random()*500,.04,"square",.05),
  pick:()=>tone(880,.06,"triangle",.08),
  good:()=>{ tone(523,.12,"triangle"); tone(784,.18,"triangle",.15,.1); },
  hot:()=>{ [523,659,784,1047,1319].forEach((f,i)=>tone(f,.14,"triangle",.14,i*.07)); },
  bad:()=>{ tone(300,.2,"sawtooth",.12); tone(180,.4,"sawtooth",.12,.18); },
  win:()=>{ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.2,"triangle",.15,i*.13)); }
};

/* ---------- title screen ---------- */
function buildNames(){
  const n = +$("teamCount").value, box = $("names");
  [...box.querySelectorAll("input.nm")].forEach((inp,i)=>cfg.names[i]=inp.value);
  box.innerHTML = "";
  for (let i=0;i<n;i++){
    const w = document.createElement("span"); w.className = "nameWrap";
    const inp = document.createElement("input");
    inp.className="field nm"; inp.maxLength=14; inp.value=cfg.names[i]||("Team "+"ABCDEF"[i]);
    inp.style.borderColor = TEAM_COLOURS[i]; inp.style.color = TEAM_COLOURS[i];
    const lab = document.createElement("label"); lab.className = "aiTick"; lab.title = "Computer plays this team";
    lab.innerHTML = '<input type="checkbox" data-ai="'+i+'"'+(cfg.ai[i]?" checked":"")+'> 🤖';
    w.append(inp, lab); box.appendChild(w);
  }
}
function syncTitle(){
  $("teamCount").value = cfg.teams; $("aiLevel").value = cfg.aiLevel;
  buildNames();
}
$("teamCount").addEventListener("change", ()=>{ buildNames(); cfg.teams=+$("teamCount").value; save(); });
$("names").addEventListener("input", ()=>{ [...$("names").querySelectorAll("input.nm")].forEach((i,k)=>cfg.names[k]=i.value); save(); });
$("names").addEventListener("change", e=>{ const t=e.target; if (t.dataset && t.dataset.ai!==undefined){ cfg.ai[+t.dataset.ai]=t.checked; save(); } });
$("aiLevel").addEventListener("change", ()=>{ cfg.aiLevel=$("aiLevel").value; save(); });
syncTitle();

/* ---------- game state ---------- */
const G = {teams:[], cur:0, dice:[6,6,6,6,6], held:[false,false,false,false,false], left:3, rolled:false, phase:"idle", tok:0};
const isAI = () => !!(G.teams[G.cur] && G.teams[G.cur].ai);
const total = t => t.sc.reduce((a,b)=>a+(b||0),0);
const turnsDone = t => t.sc.filter(x=>x!==null).length;
function later(fn, ms){ const t=G.tok; setTimeout(()=>{ if (t===G.tok && G.phase!=="over") fn(); }, ms); }
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active", s.id===id)); }
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function startGame(){
  [...$("names").querySelectorAll("input.nm")].forEach((i,k)=>cfg.names[k]=i.value.trim()||("Team "+"ABCDEF"[k]));
  cfg.teams = +$("teamCount").value; cfg.aiLevel = $("aiLevel").value; save();
  const nAI = cfg.ai.slice(0,cfg.teams).filter(Boolean).length; let aiN = 0;
  G.teams = Array.from({length:cfg.teams}, (_,i)=>{
    const ai = !!cfg.ai[i]; let name = cfg.names[i];
    if (ai && name==="Team "+"ABCDEF"[i]) name = nAI>1 ? "Computer "+(++aiN) : "Computer";
    return {name, colour:TEAM_COLOURS[i], ai, sc:Array(12).fill(null)};
  });
  G.cur = 0; G.tok++; G.phase = "idle";
  buildScoreboard(); show("game"); newTurn();
}
$("startBtn").addEventListener("click", startGame);

function buildScoreboard(){
  const sb = $("scoreboard"); sb.innerHTML = "";
  G.teams.forEach((t,i)=>{
    const d = document.createElement("div");
    d.className = "team"; d.id = "team"+i; d.style.setProperty("--tc", t.colour);
    d.innerHTML = `<div class="row"><div class="name">${esc(t.name)}</div><div class="score" id="score${i}">0</div></div><div class="tag" id="tag${i}"></div>`;
    sb.appendChild(d);
    if (i===0 && G.teams.length===2){
      const c = document.createElement("div"); c.className="centreInfo";
      c.innerHTML = `<div class="t1">⛵ Yacht</div><div class="t2">Highest total wins</div>`;
      sb.appendChild(c);
    }
  });
  renderScores();
}
function renderScores(bumpIdx){
  G.teams.forEach((t,i)=>{
    const el = $("score"+i);
    el.textContent = total(t);
    if (i===bumpIdx){ el.classList.add("bump"); setTimeout(()=>el.classList.remove("bump"),300); }
    const done = turnsDone(t);
    $("tag"+i).textContent = (t.ai ? "🤖 " : "") + (done>=12 ? "Card full" : "Turn " + (done+1) + " of 12");
    $("team"+i).classList.toggle("active", i===G.cur);
  });
}
function setMessage(text, cls){
  const m = $("message"); m.className = "message"; void m.offsetWidth;
  if (cls) m.classList.add(cls); m.textContent = text;
}
function setButtons({roll=false,next=false}){
  $("rollBtn").classList.toggle("hidden",!roll);
  $("nextBtn").classList.toggle("hidden",!next);
  $("rollBtn").disabled = $("nextBtn").disabled = false;
}

/* ---------- drawing ---------- */
function renderDice(ghost){
  const row = $("diceRow"); row.innerHTML = "";
  const canHold = !ghost && G.phase==="choose" && G.left>0 && !isAI();
  G.dice.forEach((v,i)=>{
    const d = makeDie(); showFace(d, v); d.dataset.i = i;
    if (ghost) d.classList.add("ghost");
    else if (G.held[i]) d.classList.add("held");
    if (canHold) d.classList.add("pickable");
    if (!ghost && G.held[i]){ const l=document.createElement("div"); l.className="lab"; l.textContent="Held"; d.appendChild(l); }
    else if (canHold){ const k=document.createElement("div"); k.className="key"; k.textContent=i+1; d.appendChild(k); }
    row.appendChild(d);
  });
  $("rollsLeft").textContent = G.left;
}

function renderSheet(){
  const t = G.teams[G.cur];
  const live = G.phase==="choose" && G.rolled && !isAI();
  let h = '<table><thead><tr><th></th>' + G.teams.map((x,i)=>`<th class="${i===G.cur?"cur":""}" style="color:${x.colour}">${esc(x.name)}</th>`).join("") + "</tr></thead><tbody>";
  CATS.forEach((c,ci)=>{
    h += `<tr><td class="cat"${c.tip?` title="${c.tip}"`:""}>${c.name}</td>`;
    G.teams.forEach((x,i)=>{
      const cur = i===G.cur ? " cur" : "";
      const v = x.sc[ci];
      if (v!==null) h += `<td class="cell filled${cur}">${v}</td>`;
      else if (i===G.cur && live){ const p = score(ci,G.dice); h += `<td class="cell opt${p?"":" zero"}${cur}" data-ci="${ci}">${p}</td>`; }
      else h += `<td class="cell${cur}"></td>`;
    });
    h += "</tr>";
  });
  h += '<tr class="tot"><td class="cat">Total</td>' + G.teams.map((x,i)=>`<td class="${i===G.cur?"cur":""}">${total(x)}</td>`).join("") + "</tr></tbody></table>";
  $("sheet").innerHTML = h;
}
$("sheet").addEventListener("click", e=>{
  const td = e.target.closest("td.opt"); if (td) pick(+td.dataset.ci);
});

function newTurn(){
  const t = G.teams[G.cur];
  G.dice = [6,6,6,6,6]; G.held = [false,false,false,false,false]; G.left = 3; G.rolled = false; G.phase = "start";
  renderScores(); renderSheet(); renderDice(true);
  const lbl = $("turnLabel"); lbl.style.color = t.colour;
  lbl.textContent = t.name + "'s turn";
  setMessage("Roll the five dice", "dim");
  $("rollBtn").textContent = "🎲 Roll the dice";
  setButtons({roll:true});
  if (t.ai){ setButtons({}); later(()=>roll(true), 1100); }
}

/* ---------- rolling ---------- */
function roll(viaAI){
  if (isAI() && viaAI!==true) return;
  if ((G.phase!=="start" && G.phase!=="choose") || G.left<=0) return;
  const free = [0,1,2,3,4].filter(i=>!G.held[i]);
  if (!free.length) return;
  G.phase = "rolling"; setButtons({}); setMessage("", "");
  const res = {}; free.forEach(i=>res[i]=rnd());
  renderDice(false);
  const els = [...$("diceRow").children];
  free.forEach(i=>els[i].classList.add("rolling"));
  let f = 0;
  const flick = () => {
    f++;
    free.forEach(i=>showFace(els[i], rnd())); sfx.tick();
    if (f < 14) setTimeout(flick, 40 + f*6);
    else {
      if (G.phase==="over") return;
      free.forEach(i=>{ G.dice[i] = res[i]; });
      G.left--; G.rolled = true;
      afterRoll(free);
    }
  };
  flick();
}

function afterRoll(rolledIdx){
  G.phase = "choose";
  renderDice(false);
  [...$("diceRow").children].forEach((d,i)=>{ if (rolledIdx.includes(i)){ void d.offsetWidth; d.classList.add("land"); } });
  renderSheet();
  const yacht = G.dice.every(v=>v===G.dice[0]);
  if (yacht) sfx.hot(); else sfx.good();
  if (isAI()){
    setMessage(yacht ? "⛵ YACHT!" : "", yacht ? "good" : "");
    setButtons({}); later(aiAct, 1000); return;
  }
  if (G.left>0){
    $("rollBtn").textContent = "🎲 Roll again (" + G.left + " left)";
    setButtons({roll:true});
    updateHoldUI(yacht);
  } else {
    setButtons({});
    setMessage((yacht ? "⛵ YACHT! " : "") + "No rolls left: choose a category", yacht ? "good" : "warn");
  }
}

/* ---------- holding dice ---------- */
$("diceRow").addEventListener("click", e=>{
  const d = e.target.closest(".die"); if (d) toggleHold(+d.dataset.i);
});
function toggleHold(i){
  if (isAI() || G.phase!=="choose" || G.left<=0 || !(i>=0 && i<5)) return;
  G.held[i] = !G.held[i]; sfx.pick();
  renderDice(false); updateHoldUI();
}
function updateHoldUI(yacht){
  const n = G.held.filter(Boolean).length;
  $("rollBtn").disabled = n===5;
  if (n===5) setMessage("All held: choose a category, or release a die", "warn");
  else if (n>0) setMessage("Holding " + n + ". Roll the rest, or choose a category", "dim");
  else setMessage((yacht ? "⛵ YACHT! " : "") + "Tap dice to hold them, or choose a category", yacht ? "good" : "dim");
}

/* ---------- choosing a category ---------- */
function pick(ci, viaAI){
  if (G.phase!=="choose" || !G.rolled) return;
  if (isAI() && viaAI!==true) return;
  const t = G.teams[G.cur];
  if (t.sc[ci]!==null) return;
  const v = score(ci, G.dice);
  t.sc[ci] = v; G.phase = "scored";
  renderDice(false); renderSheet(); renderScores(G.cur);
  $("rollsLeft").textContent = G.left;
  if (ci===11 && v===50){ sfx.hot(); setMessage("⛵ YACHT! 50 points!", "good"); }
  else if (v===0){ sfx.bad(); setMessage("0 in " + CATS[ci].name, "bad"); }
  else { sfx.good(); setMessage("+" + v + " in " + CATS[ci].name, "good"); }
  const done = G.cur===G.teams.length-1 && turnsDone(t)===12;
  $("nextBtn").textContent = done ? "See result ➜" : (G.teams.length===1 ? "Next turn ➜" : "Next team ➜");
  setButtons({next:true});
  if (t.ai){ setButtons({}); later(advance, 2000); }
}
function advance(){
  if (G.phase==="over") return;
  if (G.cur===G.teams.length-1 && turnsDone(G.teams[G.cur])===12) return declareResult("final");
  G.cur = (G.cur+1) % G.teams.length;
  newTurn();
}
function nextTeam(){ if (G.phase==="scored" && !isAI()) advance(); }

/* ---------- result ---------- */
function declareResult(reason){
  G.phase = "over"; G.tok++;
  const top = Math.max(...G.teams.map(total));
  const winners = G.teams.filter(t=>total(t)===top);
  sfx.win();
  const title = $("winTitle");
  if (G.teams.length===1){ title.textContent = "Final score: " + top; title.style.color = "var(--gold)"; }
  else if (winners.length>1){ title.textContent = "🤝 It's a draw!"; title.style.color = "var(--chalk)"; }
  else { title.textContent = "🏆 " + winners[0].name + " wins!"; title.style.color = winners[0].colour; }
  $("winNote").textContent = reason==="early" ? "Game ended early: most points wins." : "";
  const sorted = [...G.teams].sort((a,b)=>total(b)-total(a));
  $("resultTable").innerHTML = sorted.map(t=>`<tr><td style="color:${t.colour}">${esc(t.name)}</td><td>${total(t)}</td></tr>`).join("");
  $("winOverlay").classList.add("show");
  confetti();
}
function confetti(){
  const c=$("confetti"), ctx=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const bits = Array.from({length:180}, ()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:8+Math.random()*8,h:5+Math.random()*6,col:TEAM_COLOURS[Math.random()*6|0]}));
  let f=0;
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    bits.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.vy+=.04; b.r+=b.vr; ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r); ctx.fillStyle=b.col; ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h); ctx.restore(); });
    if (++f<260) requestAnimationFrame(draw); else ctx.clearRect(0,0,c.width,c.height);
  })();
}

/* ---------- computer players ---------- */
// Rough average a category is worth over a whole game; used to avoid wasting good categories.
const PAR = [2.1,5.3,8.6,12.2,15.7,19.2,12,13,10,10,22,4];
const openCats = t => CATS.map((_,i)=>i).filter(i=>t.sc[i]===null);
function bestChoice(dice, open){
  let b = null;
  open.forEach(ci=>{ const v = score(ci,dice) - PAR[ci]; if (!b || v>b.v) b = {ci, v}; });
  return b;
}
function greedyChoice(dice, open){
  let b = null;
  open.forEach(ci=>{ const s = score(ci,dice); if (!b || s>b.s || (s===b.s && PAR[ci]<PAR[b.ci])) b = {ci, s}; });
  return b.ci;
}
// Average value of keeping the given dice and rolling the rest once.
function evHold(held, open, memo){
  const k = 5 - held.length; let sum = 0, n = 0;
  (function rec(i, cur){
    if (i===k){
      const key = cur.slice().sort().join("");
      let v = memo.get(key);
      if (v===undefined){ v = bestChoice(cur, open).v; memo.set(key, v); }
      sum += v; n++; return;
    }
    for (let f=1; f<=6; f++){ cur.push(f); rec(i+1, cur); cur.pop(); }
  })(0, held.slice());
  return sum/n;
}
function aiAct(){
  if (G.phase!=="choose" || !isAI()) return;
  const t = G.teams[G.cur], open = openCats(t), lvl = cfg.aiLevel;
  if (G.left===0) return pick(lvl==="easy" ? greedyChoice(G.dice, open) : bestChoice(G.dice, open).ci, true);

  if (lvl==="easy"){
    const c = [0,0,0,0,0,0,0]; G.dice.forEach(v=>c[v]++);
    let face = 1; for (let v=2; v<=6; v++) if (c[v]>=c[face]) face = v;
    if (c[face]===5 || (c[face]>=4 && Math.random()<0.6) || Math.random()<0.12) return pick(greedyChoice(G.dice, open), true);
    G.held = G.dice.map(v=>v===face);
    renderDice(false);
    later(()=>roll(true), 900);
    return;
  }

  const stop = bestChoice(G.dice, open);
  const memo = new Map(), seen = new Set(); let best = null;
  for (let m=0; m<31; m++){
    const held = []; G.dice.forEach((v,i)=>{ if (m & (1<<i)) held.push(v); });
    const key = held.slice().sort().join("");
    if (seen.has(key)) continue; seen.add(key);
    let ev = evHold(held, open, memo);
    if (G.left===2) ev += 3;                           // another roll still to come
    if (lvl==="medium") ev += (Math.random()-.5)*8;    // a little careless
    if (!best || ev>best.ev) best = {ev, m};
  }
  if (stop.v >= best.ev) return pick(stop.ci, true);
  G.held = G.dice.map((_,i)=>!!(best.m & (1<<i)));
  renderDice(false);
  later(()=>roll(true), 900);
}

/* ---------- wiring ---------- */
$("rollBtn").addEventListener("click", ()=>roll());
$("nextBtn").addEventListener("click", nextTeam);
$("menuBtn").addEventListener("click", ()=>{ if (confirm("Leave this game and return to the menu?")){ G.phase="over"; G.tok++; syncTitle(); show("menu"); } });
$("endBtn").addEventListener("click", ()=>{ if (G.phase!=="over" && confirm("End the game now? The team with the most points wins.")) declareResult("early"); });
$("rulesBtn").addEventListener("click", ()=>$("rulesOverlay").classList.add("show"));
$("closeRules").addEventListener("click", ()=>$("rulesOverlay").classList.remove("show"));
$("againBtn").addEventListener("click", ()=>{ $("winOverlay").classList.remove("show"); startGame(); });
$("winMenuBtn").addEventListener("click", ()=>{ $("winOverlay").classList.remove("show"); syncTitle(); show("menu"); });
$("soundBtn").addEventListener("click", ()=>{
  soundOn = !soundOn;
  $("soundBtn").innerHTML = soundOn ? '<span class="ic">🔊</span><span class="tx"> Sound on</span>' : '<span class="ic">🔇</span><span class="tx"> Sound off</span>';
});

// Keyboard: 1–5 hold a die, Space/R roll, N/Enter next team
document.addEventListener("keydown", e=>{
  if (!$("game").classList.contains("active") || e.target.tagName==="INPUT") return;
  if (document.querySelector(".overlay.show")) return;
  const k = e.key.toLowerCase();
  if (k>="1" && k<="5") toggleHold(+k-1);
  else if (k===" " || k==="r"){ e.preventDefault(); roll(); }
  else if (k==="n" || k==="enter") nextTeam();
});

/* ---------- Dice Games hub link ---------- */
try{
  if (window.parent !== window && window.parent.DiceHub){
    const hb = document.getElementById("hubBack");
    hb.classList.remove("hidden");
    hb.addEventListener("click", ()=>window.parent.DiceHub.home());
  }
}catch(e){}
})();
</script>

<script>
(() => {
"use strict";
const FACES = {1:[4],2:[2,6],3:[2,4,6],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
document.querySelectorAll(".dice").forEach(box=>{
  box.dataset.faces.split(",").map(Number).forEach(v=>{

const hub = document.getElementById("hub"), player = document.getElementById("player");
const THEME = "<style>" + document.getElementById("lomTheme").textContent + "</style>";

function open(game){

             + '<meta name="viewport" content="width=device-width, initial-scale=1">'
             + '<script>window.HUB_MODE="' + game + '";<\/script>';
