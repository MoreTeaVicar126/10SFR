:root{
  /* LoadsOfMaths brand */
  --orange:#F47B3F; --orange-d:#c4571f; --lom-blue:#3F73B8; --lom-blue-d:#2a548c;
  /* theme */
  --board:#2b1a0e; --board2:#3d2616; --chalk:#fbefd2; --chalk-dim:#dcc79f;
  --parch:#f4e3bd; --gold:#ffcf5c; --bad:#ff8273; --good:#a8e88f; --blue:#8fc3ff;
  --teamA:#ffb26b; --teamB:#8fc3ff;
  --die:#fffaf0; --pip:#2b1a0e;
  --heading:'Super Bouncer','Trebuchet MS','Arial Rounded MT Bold',Arial,sans-serif;
  --font:'Anak Orang','Comic Sans MS','Segoe Print',cursive,sans-serif;
  --ds:clamp(84px,15vh,150px);            /* dice size */
}
[data-game=pig],[data-game=snake]{ --ds:clamp(100px,20vh,200px); }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); color:var(--chalk); overflow:hidden;
  user-select:none; -webkit-user-select:none; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(255,196,100,.30), transparent 60%),      /* lantern glow */
    radial-gradient(ellipse at 50% 125%, rgba(0,0,0,.6), transparent 62%),
    repeating-linear-gradient(90deg, transparent 0 148px, rgba(0,0,0,.38) 148px 151px), /* gaps between planks */
    repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 9px),/* wood grain */
    linear-gradient(#63401f,#3a2211);
}
button{font-family:var(--font);cursor:pointer;border:none;color:inherit}
input,select{font-family:var(--font)}

h1,h2,h3,.bigBtn,.message,.turnLabel,.modeName,.t1{
  font-family:var(--heading); font-weight:normal!important; letter-spacing:.5px;
}
.score,.turnScore,.big{font-family:var(--font);font-weight:bold}   /* numbers: the clearer of the two brand fonts */
h1{color:var(--gold);text-shadow:0 4px 0 rgba(0,0,0,.45)}

/* ---------- screens ---------- */
.screen{inset:0;padding:max(1.2vh,10px) max(1.5vw,10px);overflow-y:auto;overflow-x:hidden}
#menu{justify-content:flex-start}
#menu > h1{margin-top:auto}
#menu > :last-child{margin-bottom:auto}
#menu h1 span{color:var(--orange)}
.hubBack{top:10px;left:10px}

/* ---------- panels ---------- */
.team{background:rgba(0,0,0,.30);min-width:0}
.team.active{background:rgba(0,0,0,.48)}
.team .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modeBtn,.gameCard{background:rgba(0,0,0,.30);border:3px dashed var(--gold);color:var(--chalk)}
.modeBtn:hover,.gameCard:hover,.gameCard:focus-visible{background:rgba(0,0,0,.48);transform:scale(1.03);outline:none}
.overlay{background:rgba(10,5,0,.72)}
.overlay .card{background:linear-gradient(#4b2f1a,#33200f);border:4px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.field,.settings input,.settings select{background:rgba(0,0,0,.35);border-color:var(--chalk-dim);color:var(--chalk)}
.sec h3{color:var(--gold)}

/* ---------- buttons ---------- */
.bigBtn{background:var(--parch);color:var(--board);box-shadow:0 6px 0 #b69b66}
.bigBtn.roll{background:var(--orange);box-shadow:0 6px 0 var(--orange-d)}
.bigBtn.bank{background:var(--gold);box-shadow:0 6px 0 #b98a1c}
.bigBtn.next{background:var(--lom-blue);color:#fff;box-shadow:0 6px 0 var(--lom-blue-d)}
.bigBtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.45)!important}
.smallBtn{background:rgba(0,0,0,.35);border:2px solid var(--chalk-dim);color:var(--chalk)}
.smallBtn:hover{background:rgba(0,0,0,.55)}

/* ---------- dice ---------- */
.die{
  width:var(--ds);aspect-ratio:1;background:var(--die);border-radius:18%;padding:calc(var(--ds)*.13);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);
  box-shadow:0 calc(var(--ds)*.05) 0 #d6c49a, 0 calc(var(--ds)*.09) 18px rgba(0,0,0,.55);
}
.die .pip,.pip{border-radius:50%;background:var(--pip);width:86%;height:auto;aspect-ratio:1;margin:auto;visibility:hidden}
.die .pip.on,.pip.on{visibility:visible}
.die.one .pip.on{background:#c0262d}
.die.small{--ds:34px;box-shadow:0 3px 0 #d6c49a}
.die.sel{box-shadow:0 calc(var(--ds)*.05) 0 #d6c49a, 0 0 30px rgba(255,207,92,.85)}
.diceRow{flex-wrap:wrap;row-gap:22px;justify-content:center}
.arena{flex:1 0 auto}
.titleDice{flex-wrap:wrap}

/* ---------- bottom bar (Menu / Rules / End game … Sound) ---------- */
.controls{margin-bottom:1vh;flex-wrap:wrap;justify-content:center}
.footbar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.corner{position:static;display:flex;gap:8px;flex-wrap:wrap}
.menuBtns{flex-wrap:wrap;justify-content:center;gap:14px 2vw}
@media (hover:none){ .die .key{display:none} }

/* =====================================================================
   Phones (portrait) and narrow windows
   ===================================================================== */
@media (max-width:700px){
  :root{ --ds:min(24vw,14vh); }
  [data-game=pig],[data-game=snake]{ --ds:min(36vw,20vh); }
  .diceRow{gap:4vw;row-gap:20px;min-height:0}

  /* scoreboards */
  .topbar,.scoreboard{gap:6px}
  .scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
  .team{padding:6px 8px;border-width:3px;border-radius:14px}
  #game .team{flex-direction:column;align-items:stretch}
  .team .left{margin-right:0}
  .team .row{flex-direction:column;align-items:flex-start;gap:0}
  .team .name{font-size:17px}
  .team .score{font-size:clamp(24px,7.5vw,34px);text-align:right;align-self:flex-end}
  .team .tag{font-size:11px}
  .centreInfo{min-width:0;padding:0 2px}
  .centreInfo .modeName,.centreInfo .t1{font-size:15px}
  .centreInfo .target,.centreInfo .t2{font-size:11px}

    <button class="bigBtn bank hidden" id="bankBtn"><svg class="safe" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11V9a5 5 0 0 1 5-5h8a5 5 0 0 1 5 5v2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><rect x="3" y="11" width="18" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.5 4.2V20M16.5 4.2V20" stroke="currentColor" stroke-width="1.4"/><rect x="10.3" y="9.2" width="3.4" height="4.8" rx=".8" fill="currentColor"/></svg> Bank</button>
    <button class="bigBtn next hidden" id="nextBtn">Next team ➜</button>
  </div>

  <div class="footbar">
  <div class="corner l">
    <button class="smallBtn" id="menuBtn"><span class="ic">☰</span><span class="tx"> Menu</span></button>
    <button class="smallBtn" id="rulesBtn"><span class="ic">?</span><span class="tx"> Rules</span></button>
    <button class="smallBtn" id="endBtn"><span class="ic">🔔</span><span class="tx"> End game</span></button>
  </div>
  <div class="corner r">
    <button class="smallBtn" id="soundBtn"><span class="ic">🔊</span><span class="tx"> Sound on</span></button>
  </div>
  </div>
</section>

<!-- ============ OVERLAYS ============ -->
<div class="overlay" id="rulesOverlay">
  <div class="card">
    <h2 id="rulesTitle">Rules</h2>
    <div id="rulesBody"></div>
    <button class="bigBtn" id="closeRules">Got it</button>
  </div>
</div>
<div class="overlay" id="winOverlay">
  <div class="card">
    <h2 id="winTitle">Team A wins!</h2>
    <p style="text-align:center" id="winSub"></p>
    <button class="bigBtn roll" id="againBtn">Play again</button>
    <button class="bigBtn next" id="winMenuBtn">Menu</button>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
(() => {
"use strict";

/* ---------------- Dice drawing ---------------- */
// 3x3 grid cells 0..8, which are lit for each face
const FACES = {1:[4],2:[2,6],3:[2,4,6],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function makeDie(small){
  const d = document.createElement("div");
  d.className = "die" + (small ? " small" : "");
  for (let i=0;i<9;i++){ const p=document.createElement("div"); p.className="pip"; d.appendChild(p); }
  return d;
}
function showFace(die, n){
  const lit = FACES[n];
  [...die.children].forEach((p,i)=>p.classList.toggle("on", lit.includes(i)));
  die.classList.toggle("one", n===1);
  die.dataset.value = n;
}
const rnd = () => 1 + Math.floor(Math.random()*6);

// Menu mini dice
document.querySelectorAll("[data-mini]").forEach(box=>{
  const n = +box.dataset.mini;
  for (let i=0;i<n;i++){ const d=makeDie(true); d.style.width="54px"; d.style.padding="7px"; showFace(d, 1); box.appendChild(d); }
});

/* ---------------- Sound (Web Audio, no files) ---------------- */
let soundOn = true, actx = null;
function tone(freq, dur, type="sine", vol=0.15, delay=0){
  if (!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
const sfx = {
  tick: () => tone(700+Math.random()*500, .04, "square", .05),
  good: () => { tone(523,.12,"triangle"); tone(784,.18,"triangle",.15,.1); },
  bank: () => { [523,659,784,1047].forEach((f,i)=>tone(f,.15,"triangle",.14,i*.08)); },
  bad:  () => { tone(300,.2,"sawtooth",.12); tone(180,.4,"sawtooth",.12,.18); },
  fatal:() => { [400,300,220,140,90].forEach((f,i)=>tone(f,.25,"sawtooth",.13,i*.14)); },
  win:  () => { [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.2,"triangle",.15,i*.13)); }
};

/* ---------------- State ---------------- */
const $ = id => document.getElementById(id);
const S = {
  mode:"pig", target:100, names:["Team A","Team B"],
  scores:[0,0], current:0, turn:0, rolls:[], ai:null, tok:0,
  phase:"ready", finalTurn:false, // ready | rolling | choose | bust | banking | over
};

const RULES = {
  pig: {
    title:"🐷 Pig",
    html:()=>`<ul>
      <li>Roll <b>one die</b> as many times as you like.</li>
      <li>Each roll adds its spots to your <b>turn score</b>.</li>
      <li>Press <b>Bank</b> to add your turn score to your team total and pass the die.</li>
      <li>Roll a <b>1</b>? <b>Pig!</b> Your turn ends and you score nothing this turn.</li>
      <li>When ${S.names[0]} banks <b>${S.target}</b> or more, ${S.names[1]} gets <b>one final turn</b> to beat that score.</li>
      <li>Otherwise, the first team to bank <b>${S.target}</b> or more wins.</li>
      <li><b>End game</b> finishes early (e.g. at the bell): the team with the most banked points wins.</li></ul>`
  },
  snake: {
    title:"🐍 Snake Eyes",
    html:()=>`<ul>
      <li>Roll <b>two dice</b> as many times as you like; both add to your <b>turn score</b>.</li>
      <li>Press <b>Bank</b> to add your turn score to your team total.</li>
      <li>Exactly one <b>1</b>? <b>Snake Bite!</b> Turn ends, you score nothing this turn.</li>
      <li>Two <b>1</b>s? <b>Snake Eyes!</b> Turn ends <i>and</i> your banked total goes back to <b>0</b>.</li>
      <li>When ${S.names[0]} banks <b>${S.target}</b> or more, ${S.names[1]} gets <b>one final turn</b> to beat that score.</li>
      <li>Otherwise, the first team to bank <b>${S.target}</b> or more wins.</li>
      <li><b>End game</b> finishes early (e.g. at the bell): the team with the most banked points wins.</li></ul>`
  }
};

/* ---------------- Screens ---------------- */
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active", s.id===id)); }

document.querySelectorAll(".modeBtn").forEach(b=>b.addEventListener("click", ()=>startGame(b.dataset.mode)));

function startGame(mode){
  S.mode = mode;
  S.target = +$("target").value;
  S.names = [$("nameA").value.trim()||"Team A", $("nameB").value.trim()||"Team B"];
  S.scores = [0,0]; S.current = 0; S.finalTurn = false;
  S.tok++;
  const opp = $("opp").value; S.ai = opp==="human" ? null : opp;
  try{ localStorage.setItem("dice-opp", opp); }catch(e){}
  if (S.ai && S.names[1]==="Team B") S.names[1] = "Computer";
  $("labelA").textContent = S.names[0]; $("labelB").textContent = S.names[1];
  $("modeName").textContent = mode==="pig" ? "🐷 Pig" : "🐍 Snake Eyes";
  $("targetLabel").textContent = "First to " + S.target;
  const row = $("diceRow"); row.innerHTML = "";
  const n = mode==="pig" ? 1 : 2;
  for (let i=0;i<n;i++){ const d=makeDie(); showFace(d, 6-i); row.appendChild(d); }
  renderScores();
  show("game");
  newTurn(true);
}

function newTurn(first){
  S.turn = 0; S.rolls = []; S.phase = "ready";
  $("teamA").classList.toggle("active", S.current===0);
  $("teamB").classList.toggle("active", S.current===1);
  $("turnLabel").textContent = S.names[S.current] + "'s turn";
  $("turnLabel").style.color = S.current===0 ? "var(--teamA)" : "var(--teamB)";
  $("turnLabel").classList.remove("final");
  if (S.finalTurn){
    void $("turnLabel").offsetWidth;
    $("turnLabel").classList.add("final");
    $("turnLabel").textContent = S.names[1] + "'s FINAL turn: beat " + S.scores[0] + "!";
    setMessage("Need " + (S.scores[0] - S.scores[1] + 1) + " to win", "hint");
  } else setMessage(first ? "Press Roll now to start" : "", first ? "hint" : "");
  $("turnScore").textContent = "0";
  $("history").innerHTML = "";
  $("rollBtn").textContent = "🎲 Roll now";
  setButtons({roll:true});
  if (isAI()){ setButtons({}); later(()=>roll(true), 1100); }
}

function setButtons({roll=false, bank=false, next=false}){
  $("rollBtn").classList.toggle("hidden", !roll);
  $("bankBtn").classList.toggle("hidden", !bank);
  $("nextBtn").classList.toggle("hidden", !next);
  $("rollBtn").disabled = $("bankBtn").disabled = $("nextBtn").disabled = false;
}

function setMessage(text, cls){
  const m = $("message");
  m.className = "message";
  void m.offsetWidth; // restart animation
  if (cls) m.classList.add(cls);
  m.textContent = text;
}

function renderScores(){
  ["A","B"].forEach((t,i)=>{
    $("score"+t).textContent = S.scores[i];
    $("bar"+t).style.width = Math.min(100, S.scores[i]/S.target*100) + "%";
  });
}

/* ---------------- Rolling ---------------- */
function roll(viaAI){
  if (isAI() && viaAI!==true) return;
  if (S.phase!=="ready" && S.phase!=="choose") return;
  S.phase = "rolling";
  $("rollBtn").disabled = true; $("bankBtn").disabled = true;
  setMessage("", "");
  const dice = [...$("diceRow").children];
  const results = dice.map(()=>rnd());
  dice.forEach(d=>{ d.classList.remove("land"); d.classList.add("rolling"); });

  let frames = 0; const total = 14;
  const flick = () => {
    frames++;
    dice.forEach(d=>showFace(d, rnd()));
    sfx.tick();
    if (frames < total) setTimeout(flick, 40 + frames*6);
    else {
      dice.forEach((d,i)=>{ d.classList.remove("rolling"); showFace(d, results[i]); void d.offsetWidth; d.classList.add("land"); });
      if (S.phase==="over") return;
      resolve(results);
    }
  };
  flick();
}

function addHistory(results){
  const pair = document.createElement("div"); pair.className = "pair";
  results.forEach(v=>{ const d=makeDie(true); showFace(d,v); pair.appendChild(d); });
  $("history").appendChild(pair);
}

function resolve(results){
  addHistory(results);
  const ones = results.filter(v=>v===1).length;
  const team = S.current;

  if (S.mode==="pig" && ones===1){
    return bust("🐷 Pig! Turn ends", false);
  }
  if (S.mode==="snake" && ones===2){
    return bust("🐍🐍 Snake Eyes! Score resets", true);
  }
  if (S.mode==="snake" && ones===1){
    return bust("🐍 Snake Bite! Turn ends", false);
  }

  const sum = results.reduce((a,b)=>a+b,0);
  S.turn += sum;
  const ts = $("turnScore");
  ts.textContent = S.turn; ts.classList.add("pop"); setTimeout(()=>ts.classList.remove("pop"),200);
  sfx.good();

  const ifBank = S.scores[team] + S.turn;
  if (S.finalTurn){
    if (ifBank > S.scores[0]) setMessage("Bank now to win! 🏆", "hint");
    else if (ifBank === S.scores[0]) setMessage("+" + sum + "  (bank now to draw)", "good");
    else setMessage("+" + sum + "  (need " + (S.scores[0] - ifBank + 1) + " more to win)", "good");
  } else if (ifBank >= S.target){
    setMessage(team===0 ? "Bank now to reach " + S.target + "! (" + S.names[1] + " then gets a final turn)" : "Bank now to win! 🏆", "hint");
  } else setMessage("+" + sum + "  (" + ifBank + " if you bank)", "good");

  S.phase = "choose";
  $("rollBtn").textContent = "🎲 Roll again";
  setButtons({roll:true, bank:true});
  if (isAI()){ setButtons({}); later(aiDecide, 1100); }
}

function bust(text, fatal){
  S.phase = "bust";
  S.turn = 0;
  $("turnScore").textContent = "0";
  setMessage(text, "bad");
  if (fatal){
    sfx.fatal();
    const t = S.current===0 ? "A" : "B";
    if (S.scores[S.current] > 0){
      const el = $("score"+t);
      el.classList.remove("crash"); void el.offsetWidth; el.classList.add("crash");
      countTo(S.current, 0);
    }
  } else sfx.bad();
  setButtons({next:true});
  $("nextBtn").textContent = S.finalTurn ? "See result ➜" : "Next team ➜";
  if (isAI()){ setButtons({}); later(()=>nextTeam(true), 1800); }
}

function bank(viaAI){
  if (S.phase!=="choose") return;
  if (isAI() && viaAI!==true) return;
  const team = S.current;
  const target = S.scores[team] + S.turn;
  sfx.bank();
  setMessage("Banked " + S.turn + "!", "good");
  S.phase = "banking";
  $("rollBtn").disabled = $("bankBtn").disabled = true;
  countTo(team, target, () => {
    if (S.phase==="over") return;
    if (S.finalTurn) return declareResult("final");
    if (S.scores[team] >= S.target){
      if (team===0){ S.finalTurn = true; S.current = 1; return newTurn(false); }
      return declareResult("target");
    }
    S.current = 1 - S.current;
    newTurn(false);
  });
}

// animate score counting up/down
function countTo(team, value, done){
  const t = team===0 ? "A" : "B";
  const el = $("score"+t);
  const start = S.scores[team];
  S.scores[team] = value;
  const steps = Math.min(25, Math.abs(value-start)) || 1;
  let i = 0;
  el.classList.add("bump");
  const step = () => {
    i++;
    el.textContent = Math.round(start + (value-start)*i/steps);
    if (i < steps) setTimeout(step, 30);
    else { el.classList.remove("bump"); renderScores(); done && setTimeout(done, 350); }
  };
  $("bar"+t).style.width = Math.min(100, value/S.target*100) + "%";
  step();
}

function nextTeam(viaAI){
  if (S.phase!=="bust") return;
  if (isAI() && viaAI!==true) return;
  if (S.finalTurn) return declareResult("final");
  S.current = 1 - S.current;
  newTurn(false);
}

function declareResult(reason){
  S.phase = "over";
  const [a,b] = S.scores;
  const team = a===b ? -1 : (a>b ? 0 : 1);
  sfx.win();
  if (team<0){
    $("winTitle").textContent = "🤝 It's a draw!";
    $("winTitle").style.color = "var(--chalk)";
  } else {
    $("winTitle").textContent = "🏆 " + S.names[team] + " wins!";
    $("winTitle").style.color = team===0 ? "var(--teamA)" : "var(--teamB)";
  }
  const note = reason==="early" ? "Game ended early – most points wins.  " : "";
  $("winSub").textContent = note + S.names[0] + " " + a + "  –  " + b + " " + S.names[1];
  $("winOverlay").classList.add("show");
  confetti();
}

/* ---------------- Confetti ---------------- */
function confetti(){
  const c = $("confetti"), ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#ffd166","#7fd1ff","#8ce99a","#ff6b6b","#f4f1e6"];
  const bits = Array.from({length:180}, ()=>({
    x:Math.random()*c.width, y:-20-Math.random()*c.height*.5,
    vx:(Math.random()-.5)*4, vy:2+Math.random()*4, r:Math.random()*6.28,
    vr:(Math.random()-.5)*.3, w:8+Math.random()*8, h:5+Math.random()*6, col:cols[Math.random()*5|0]
  }));
  let f = 0;
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    bits.forEach(b=>{
      b.x+=b.vx; b.y+=b.vy; b.vy+=.04; b.r+=b.vr;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r); ctx.fillStyle=b.col;
      ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h); ctx.restore();
    });
    if (++f < 260) requestAnimationFrame(draw); else ctx.clearRect(0,0,c.width,c.height);
  })();
}

/* ---------------- Computer opponent (Team B) ---------------- */
const isAI = () => !!S.ai && S.current===1;
function later(fn, ms){ const t=S.tok; setTimeout(()=>{ if (t===S.tok && S.phase!=="over") fn(); }, ms); }
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
function aiDecide(){
  if (S.phase!=="choose" || !isAI()) return;
  if (aiWantsBank()) bank(true); else roll(true);
}
// Decides whether to bank, using the turn score, both banked totals and the chosen level.
function aiWantsBank(){
  const me=S.scores[1], opp=S.scores[0], T=S.turn, L=S.ai;
  if (T<=0) return false;
  if (S.finalTurn) return me+T > opp;          // last chance: keep going until ahead
  if (me+T >= S.target) return true;           // banking wins the game
  const gap = opp - me;                        // positive = computer is behind
  const chase = opp >= S.target-20;            // opponent about to win: take more risk
  let th;
  if (S.mode==="pig"){
    if (L==="easy") th = 8 + Math.random()*8;
    else if (L==="medium") th = 18 + clamp(gap/6,-5,7) + (Math.random()*6-3);
    else { th = 20 + clamp(gap/5,-8,12); if (chase) th += 8; }
  } else {
    // Snake Eyes: roll while the expected gain beats the expected loss
    const base = (200 - me)/11;
    if (L==="easy") th = 8 + Math.random()*10;
    else if (L==="medium") th = base*(0.8+Math.random()*0.4) + clamp(gap/20,-3,5);
    else { th = base + clamp(gap/18,-3,6); if (chase) th += 6; }
    th = Math.max(th, 5);
  }
  return T >= th;
}

/* ---------------- Wiring ---------------- */
$("rollBtn").addEventListener("click", roll);
$("bankBtn").addEventListener("click", bank);
$("nextBtn").addEventListener("click", nextTeam);
$("menuBtn").addEventListener("click", ()=>{ if (confirm("Leave this game and return to the menu?")){ S.tok++; show("menu"); } });
$("rulesBtn").addEventListener("click", ()=>{
  const r = RULES[S.mode];
  $("rulesTitle").textContent = r.title;
  $("rulesBody").innerHTML = r.html();
  $("rulesOverlay").classList.add("show");
});
$("endBtn").addEventListener("click", ()=>{
  if (S.phase==="over") return;
  if (confirm("End the game now? The team with the most banked points wins.")) declareResult("early");
});
$("closeRules").addEventListener("click", ()=>$("rulesOverlay").classList.remove("show"));
$("againBtn").addEventListener("click", ()=>{ $("winOverlay").classList.remove("show"); startGame(S.mode); });
$("winMenuBtn").addEventListener("click", ()=>{ $("winOverlay").classList.remove("show"); show("menu"); });
$("soundBtn").addEventListener("click", ()=>{
  soundOn = !soundOn;
  $("soundBtn").innerHTML = soundOn ? '<span class="ic">🔊</span><span class="tx"> Sound on</span>' : '<span class="ic">🔇</span><span class="tx"> Sound off</span>';
});

// Keyboard: Space/R = roll, B = bank, N/Enter = next team
document.addEventListener("keydown", e=>{
  if (!$("game").classList.contains("active") || e.target.tagName==="INPUT") return;
  if (document.querySelector(".overlay.show")) return;
  const k = e.key.toLowerCase();
  if (k===" " || k==="r"){ e.preventDefault(); roll(); }
  else if (k==="b") bank();
  else if (k==="n" || k==="enter") nextTeam();
});

/* ---------- Dice Games hub link (only active when opened from the hub) ---------- */
try{
  if (window.parent !== window && window.parent.DiceHub){
    const hb = document.getElementById("hubBack");
    hb.classList.remove("hidden");
    hb.addEventListener("click", ()=>window.parent.DiceHub.home());
  }
}catch(e){}

try{
  const so = localStorage.getItem("dice-opp");
  if (so && [...$("opp").options].some(o=>o.value===so)) $("opp").value = so;
}catch(e){}

/* When the hub opens this game as Pig or Snake Eyes, show just that mode */
if (window.HUB_MODE === "pig" || window.HUB_MODE === "snake"){
  const keep = window.HUB_MODE;
  document.querySelector("#menu h1").textContent = keep==="pig" ? "🐷 Pig" : "🐍 Snake Eyes";
  document.querySelectorAll(".modeBtn").forEach(b=>{
    if (b.dataset.mode !== keep) b.remove();
    else b.querySelector("h2").textContent = "▶ Start game";
  });
}
})();
</script>
</template>

<template id="game-tenk">
<title>10,000 | LoadsOfMaths</title>
<style>
button{font-family:var(--font);cursor:pointer;border:none;color:inherit}
input,select{font-family:var(--font)}
.screen{position:absolute;inset:14px;display:none;flex-direction:column;align-items:center}
.screen.active{display:flex}
.hidden{display:none!important}

/* ---------- Title ---------- */
#menu{justify-content:center;gap:3.5vh;text-align:center}
#menu h1{font-size:clamp(56px,10vw,140px);letter-spacing:4px;text-shadow:3px 3px 0 rgba(0,0,0,.35);line-height:1}
.titleDice{display:flex;gap:14px;justify-content:center}
.setupGrid{display:grid;grid-template-columns:auto auto;gap:1.6vh 1.5vw;align-items:center;font-size:clamp(16px,1.9vw,26px);text-align:left}
.setupGrid label{color:var(--chalk-dim)}
.field{font-size:inherit;background:rgba(255,255,255,.1);color:var(--chalk);border:2px solid var(--chalk-dim);border-radius:10px;padding:4px 10px}
.field option{color:#000}
.names{display:flex;flex-wrap:wrap;gap:10px;max-width:60vw}
.names input.nm{width:8.5em}
.nameWrap{display:flex;align-items:center;gap:6px}
.aiTick{display:flex;align-items:center;gap:3px;cursor:pointer;font-size:.9em;color:var(--chalk-dim)}
.aiTick input{width:20px;height:20px;accent-color:var(--gold)}
.check{display:flex;align-items:center;gap:10px;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--gold)}
.menuBtns{display:flex;gap:2vw}

/* ---------- Buttons ---------- */
.bigBtn{
  font-size:clamp(24px,3.2vw,48px);padding:1.1vh 3vw;border-radius:20px;
  background:var(--chalk);color:var(--board);box-shadow:0 6px 0 #a9a491;transition:transform .08s;white-space:nowrap
}
.bigBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #a9a491}
.bigBtn.roll{background:var(--good);box-shadow:0 6px 0 #4f9a5c}
.bigBtn.bank{background:var(--gold);box-shadow:0 6px 0 #b38d2c}
.bigBtn.next{background:var(--blue);box-shadow:0 6px 0 #3e8bb5}
.bigBtn:disabled{opacity:.35;pointer-events:none}
.bigBtn .safe{width:1em;height:1em;vertical-align:-.12em}
.smallBtn{font-size:clamp(14px,1.4vw,20px);padding:6px 14px;border-radius:12px;background:rgba(255,255,255,.1);border:2px solid var(--chalk-dim)}
.smallBtn:hover{background:rgba(255,255,255,.2)}
.smallBtn:disabled{opacity:.35;pointer-events:none}

/* ---------- Game ---------- */
#game{padding:1.2vh 1.5vw;justify-content:space-between}
.scoreboard{width:100%;display:flex;gap:1vw;align-items:stretch}
.team{
  flex:1;min-width:0;border-radius:18px;padding:.8vh 1vw;background:rgba(255,255,255,.05);
  border:4px solid transparent;opacity:.55;transition:all .3s;display:flex;flex-direction:column;justify-content:center
}
.team.active{opacity:1;background:rgba(255,255,255,.1);border-color:var(--tc);box-shadow:0 0 22px color-mix(in srgb,var(--tc) 40%,transparent)}
.team .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.team .name{font-size:clamp(16px,2vw,32px);color:var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .score{font-size:clamp(30px,4.6vw,72px);font-weight:bold;line-height:1.05;transition:transform .3s}
.team .score.bump{transform:scale(1.2)}
.team .tag{font-size:clamp(11px,1.1vw,16px);color:var(--chalk-dim);min-height:1.2em}
.team .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.team .bar i{display:block;height:100%;width:0;background:var(--tc);transition:width .5s}
.centreInfo{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 .5vw}
.centreInfo .t1{font-size:clamp(20px,2.4vw,36px)} .centreInfo .t2{font-size:clamp(12px,1.3vw,18px);color:var(--chalk-dim)}

.turnLabel{font-size:clamp(20px,2.5vw,36px);margin-top:.6vh;min-height:1.3em}
.turnLabel.final{animation:wobble .6s}
.arena{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;width:100%}
.diceRow{display:flex;gap:2vw;min-height:clamp(100px,17vh,170px);align-items:center;justify-content:center}

.die{
  width:clamp(90px,15vh,150px);aspect-ratio:1;background:var(--die);border-radius:18%;
  box-shadow:0 7px 0 #cfcab8, 0 12px 20px rgba(0,0,0,.45);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:clamp(10px,1.8vh,20px);
  transition:transform .15s, box-shadow .15s, outline-color .15s;outline:6px solid transparent;outline-offset:4px;position:relative
}
.die .pip{border-radius:50%;background:var(--pip);width:86%;height:auto;aspect-ratio:1;margin:auto;visibility:hidden}
.die .pip.on{visibility:visible}
.die.ghost{opacity:.18}
.die.pickable{cursor:pointer}
.die.sel{transform:translateY(-14px);outline-color:var(--gold);box-shadow:0 7px 0 #cfcab8, 0 0 30px rgba(255,209,102,.7)}
.die.rolling{animation:shake .12s infinite}
.die.land{animation:land .35s}
.die .key{position:absolute;bottom:-1.9em;left:0;right:0;text-align:center;font-size:clamp(12px,1.2vw,16px);color:var(--chalk-dim);pointer-events:none}
.die.small{width:32px;padding:4px;border-radius:20%;box-shadow:0 3px 0 #cfcab8;outline:none}
.die.small .pip{width:82%}
@keyframes shake{0%{transform:rotate(-8deg) translateY(-4px)}50%{transform:rotate(8deg) translateY(4px)}100%{transform:rotate(-8deg) translateY(-4px)}}
@keyframes land{0%{transform:scale(1.2)}60%{transform:scale(.93)}100%{transform:scale(1)}}
@keyframes wobble{0%{transform:scale(.5)}50%{transform:scale(1.15) rotate(-3deg)}100%{transform:scale(1)}}

.message{font-size:clamp(22px,3.4vw,50px);min-height:1.35em;text-align:center;margin-top:1.2vh}
.message.bad{color:var(--bad);animation:wobble .6s;font-size:clamp(40px,6vw,90px)}
.message.good{color:var(--good)}
.message.warn{color:var(--gold)}
.message.dim{color:var(--chalk-dim)}

.totals{display:flex;gap:5vw;align-items:flex-end}
.totals .box{text-align:center}
.totals .lbl{font-size:clamp(15px,1.7vw,24px);color:var(--chalk-dim)}
.totals .big{font-size:clamp(46px,8vh,96px);font-weight:bold;line-height:1;transition:transform .2s}
.totals .big.pop{transform:scale(1.18)}
.tray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:52px;max-width:92vw}
.group{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:10px;background:rgba(255,255,255,.08);font-size:clamp(13px,1.3vw,18px)}
.group b{margin-left:6px;color:var(--good)}
.combos{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-height:21vh;overflow-y:auto;max-width:94vw;padding:2px}
.combo{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:14px;background:rgba(0,0,0,.35);border:2px solid var(--chalk-dim);color:var(--chalk);font-size:clamp(13px,1.45vw,20px);cursor:pointer}
.combo:hover{background:rgba(0,0,0,.55)}
.combo.on{border-color:var(--gold);background:rgba(255,207,92,.22)}
.combo b{color:var(--gold);margin-left:4px}
.combo .die.small{--ds:24px;box-shadow:0 2px 0 #d6c49a}
.combo .dgrp{display:flex;gap:3px}
#game.combosOn{--ds:clamp(56px,min(11vh,16vw),120px)}

.controls{display:flex;gap:2vw;align-items:center;margin-bottom:calc(1vh + 44px);min-height:clamp(64px,10vh,110px)}
.corner{position:absolute;bottom:1.2vh;display:flex;gap:10px}
.corner.l{left:1.5vw} .corner.r{right:1.5vw}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10}
.overlay.show{display:flex}
.card{background:var(--board2);border:4px dashed var(--chalk-dim);border-radius:24px;padding:3vh 3vw;max-width:min(1100px,94vw);max-height:92vh;overflow:auto;text-align:center}
.card h2{font-size:clamp(30px,4.4vw,62px);margin-bottom:1.5vh}
.card p,.card li{font-size:clamp(15px,1.7vw,24px);line-height:1.45;text-align:left}
.card ul{margin:1vh 0 1.5vh 1.2em}
.card .bigBtn{margin-top:1.5vh}
.rulesTable{border-collapse:collapse;margin:1vh auto;font-size:clamp(14px,1.6vw,22px)}
.rulesTable td{padding:3px 16px;border-bottom:1px dashed rgba(255,255,255,.2);text-align:left}
.rulesTable td:last-child{text-align:right;color:var(--gold)}
.rulesCols{display:flex;gap:3vw;flex-wrap:wrap;justify-content:center;align-items:flex-start}

.settingsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:2vh 2.5vw;text-align:left}
.sec h3{font-size:clamp(18px,1.9vw,26px);color:var(--gold);margin-bottom:.6vh;border-bottom:2px dashed rgba(255,255,255,.2)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0;font-size:clamp(14px,1.5vw,20px)}
.srow .field{width:6.5em;text-align:right;padding:2px 8px}
.srow.off .field{opacity:.35}
.srow .check input{width:20px;height:20px}
.radioRow{display:flex;gap:18px;padding:4px 0;font-size:clamp(14px,1.5vw,20px)}
.radioRow input{accent-color:var(--gold);width:18px;height:18px;vertical-align:-3px}
.settingsCard{width:min(1100px,94vw);display:flex;flex-direction:column;overflow:hidden;padding:2vh 2.5vw}
.settingsCard h2{margin-bottom:1vh}
.settingsCard .settingsGrid{overflow:auto;flex:1;min-height:0;padding-right:6px}
.cardBtns{display:flex;gap:2vw;justify-content:center;flex-shrink:0}
.cardBtns .bigBtn{font-size:clamp(20px,2.4vw,34px);margin-top:1.5vh}
.note{font-size:clamp(12px,1.2vw,16px);color:var(--chalk-dim);margin-top:4px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:11}
.resultTable{margin:1vh auto 0;border-collapse:collapse;font-size:clamp(18px,2.2vw,32px)}
.resultTable td{padding:4px 22px;text-align:left}
.resultTable td:last-child{text-align:right;font-weight:bold}
.hubBack{position:absolute;top:1.5vh;left:1.5vw}

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("en-GB");
const TEAM_COLOURS = ["#ffd166","#7fd1ff","#ff9ecd","#8ce99a","#c9a7ff","#ffa66b"];

/* =================== SETTINGS =================== */
const DEFAULTS = {
  single1:100, single5:50,
  t1:1000, t2:200, t3:300, t4:400, t5:500, t6:600,
  nkMode:"double", m4:2, m5:4, m6:8, f4:1000, f5:2000, f6:3000,
  straightOn:true, straight:1500,
  threePairsOn:true, threePairs:1500,
  twoTripletsOn:true, twoTriplets:2500,
  fourPairOn:true, fourPair:1500,
  fullHouseOn:false, fullHouse:1500,
  openMinOn:false, openMin:750,
  penaltyOn:false, penalty:500,
  target:10000, teams:2, names:["Team A","Team B","Team C","Team D","Team E","Team F"],
  ai:[false,false,false,false,false,false], aiLevel:"medium"
};
const KEY = "tenk-settings-v1";
let cfg = load();
function load(){
  let c = JSON.parse(JSON.stringify(DEFAULTS));
  try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if (s) Object.assign(c, s); }catch(e){}
  return c;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(cfg)); }catch(e){} }

/* =================== SCORING ENGINE =================== */
// counts: array[7], index 1..6. Returns {pts, parts} using EVERY die, or null if impossible.
const NUM = ["","","","Three","Four","Five","Six"];
function nOfKind(v,n){
  const base = cfg["t"+v];
  if (n===3) return base;
  return cfg.nkMode==="double" ? base*cfg["m"+n] : cfg["f"+n];
}
function patternsFor(c){
  const out = [], total = c.reduce((a,b)=>a+b,0);
  const use = (arr) => arr;
  if (total===6){
    if (cfg.straightOn && [1,2,3,4,5,6].every(v=>c[v]===1))
      out.push({name:"Straight 1–6", pts:cfg.straight, use:[0,1,1,1,1,1,1]});
    if (cfg.fourPairOn && c.slice(1).includes(4) && c.slice(1).includes(2))
      out.push({name:"Four of a kind + pair", pts:cfg.fourPair, use:c.slice()});
    if (cfg.threePairsOn && c.slice(1).every(n=>n%2===0) && c.slice(1).filter(n=>n>0).length>=2)
      out.push({name:"Three pairs", pts:cfg.threePairs, use:c.slice()});
    if (cfg.twoTripletsOn && c.slice(1).filter(n=>n===3).length===2)
      out.push({name:"Two triplets", pts:cfg.twoTriplets, use:c.slice()});
  }
  if (cfg.fullHouseOn && total>=5){
    for (let a=1;a<=6;a++) if (c[a]>=3) for (let b=1;b<=6;b++) if (b!==a && c[b]>=2){
      const u=[0,0,0,0,0,0,0]; u[a]=3; u[b]=2;
      out.push({name:"Full house", pts:cfg.fullHouse, use:u});
    }
  }
  for (let v=1;v<=6;v++) for (let n=3;n<=c[v];n++){
    const u=[0,0,0,0,0,0,0]; u[v]=n;
    out.push({name:NUM[n]+" "+v+"s", pts:nOfKind(v,n), use:u});
  }
  if (c[1]>0) out.push({name:"Single 1", pts:cfg.single1, use:[0,1,0,0,0,0,0]});
  if (c[5]>0) out.push({name:"Single 5", pts:cfg.single5, use:[0,0,0,0,0,1,0]});
  return out;
}
function scoreAll(c, memo={}){
  const k = c.join(",");
  if (k in memo) return memo[k];
  if (c.every(n=>n===0)) return memo[k] = {pts:0, parts:[]};
  let best = null;
  for (const p of patternsFor(c)){
    const rest = c.map((n,i)=>n-p.use[i]);
    const r = scoreAll(rest, memo);
    if (r && (!best || p.pts + r.pts > best.pts)) best = {pts:p.pts + r.pts, parts:[{name:p.name,pts:p.pts}, ...r.parts]};
  }
  return memo[k] = best;
}
function countsOf(vals){ const c=[0,0,0,0,0,0,0]; vals.forEach(v=>c[v]++); return c; }
function scoreDice(vals){ return vals.length ? scoreAll(countsOf(vals)) : null; }
function bestSubset(vals){
  let best = {pts:0, mask:0, parts:[]};
  for (let m=1; m < (1<<vals.length); m++){
    const pick = vals.filter((_,i)=>m & (1<<i));
    const r = scoreDice(pick);
    if (r && (r.pts > best.pts || (r.pts===best.pts && pick.length > popcount(best.mask))))
      best = {pts:r.pts, mask:m, parts:r.parts};
  }
  return best;
}
const popcount = m => { let n=0; while(m){ n+=m&1; m>>=1; } return n; };
function describe(parts){
  const agg = [];
  parts.forEach(p=>{
    const e = agg.find(a=>a.name===p.name);
    if (e) e.n++; else agg.push({name:p.name, pts:p.pts, n:1});
  });
  return agg.map(a=> a.n>1 ? a.n+" × "+a.name.replace("Single ","") + "s" : a.name).join(" + ");
}
window.TenKEngine = { scoreDice, bestSubset, describe, get cfg(){ return cfg; }, set cfg(v){ cfg=v; } };

/* =================== DICE =================== */
const FACES = {1:[4],2:[2,6],3:[2,4,6],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function makeDie(small){
  const d = document.createElement("div");
  d.className = "die" + (small ? " small" : "");
  for (let i=0;i<9;i++){ const p=document.createElement("div"); p.className="pip"; d.appendChild(p); }
  return d;
}
function showFace(die,n){ const lit=FACES[n]; [...die.querySelectorAll(".pip")].forEach((p,i)=>p.classList.toggle("on", lit.includes(i))); }
const rnd = () => 1 + Math.floor(Math.random()*6);
[1,2,3,4,5,6].forEach(v=>{ const d=makeDie(true); d.style.width="56px"; d.style.padding="8px"; showFace(d,v); $("titleDice").appendChild(d); });

/* =================== SOUND =================== */
let soundOn = true, actx = null;
function tone(freq,dur,type="sine",vol=.15,delay=0){
  if (!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime+delay, o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
const sfx = {
  tick:()=>tone(700+Math.random()*500,.04,"square",.05),
  pick:()=>tone(880,.06,"triangle",.08),
  good:()=>{ tone(523,.12,"triangle"); tone(784,.18,"triangle",.15,.1); },
  hot:()=>{ [523,659,784,1047,1319].forEach((f,i)=>tone(f,.14,"triangle",.14,i*.07)); },
  bank:()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,.15,"triangle",.14,i*.08)); },
  bad:()=>{ tone(300,.2,"sawtooth",.12); tone(180,.4,"sawtooth",.12,.18); },
  win:()=>{ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.2,"triangle",.15,i*.13)); }
};

/* =================== TITLE SCREEN =================== */
function buildNames(){
  const n = +$("teamCount").value, box = $("names");
  [...box.querySelectorAll("input.nm")].forEach((inp,i)=>cfg.names[i]=inp.value);
  box.innerHTML = "";
  for (let i=0;i<n;i++){
    const w = document.createElement("span"); w.className = "nameWrap";
    const inp = document.createElement("input");
    inp.className="field nm"; inp.maxLength=14; inp.value=cfg.names[i]||("Team "+"ABCDEF"[i]);
    inp.style.borderColor = TEAM_COLOURS[i]; inp.style.color = TEAM_COLOURS[i];
    const lab = document.createElement("label"); lab.className = "aiTick"; lab.title = "Computer plays this team";
    lab.innerHTML = '<input type="checkbox" data-ai="'+i+'"'+(cfg.ai[i]?" checked":"")+'> 🤖';
    w.append(inp, lab); box.appendChild(w);
  }
}
function syncTitle(){
  $("teamCount").value = cfg.teams; $("target").value = cfg.target;
  $("openQuick").checked = cfg.openMinOn;
  $("aiLevel").value = cfg.aiLevel;
  $("openQuickLbl").textContent = "Need " + fmt(cfg.openMin) + " to get on the board";
  buildNames();
}
$("teamCount").addEventListener("change", ()=>{ buildNames(); cfg.teams=+$("teamCount").value; save(); });
$("target").addEventListener("change", ()=>{ cfg.target=+$("target").value; save(); });
$("openQuick").addEventListener("change", ()=>{ cfg.openMinOn=$("openQuick").checked; save(); });
$("names").addEventListener("input", ()=>{ [...$("names").querySelectorAll("input.nm")].forEach((i,k)=>cfg.names[k]=i.value); save(); });
$("names").addEventListener("change", e=>{ const t=e.target; if (t.dataset && t.dataset.ai!==undefined){ cfg.ai[+t.dataset.ai]=t.checked; save(); } });
$("aiLevel").addEventListener("change", ()=>{ cfg.aiLevel=$("aiLevel").value; save(); });
syncTitle();

/* =================== SETTINGS OVERLAY =================== */
const SECTIONS = [
  {title:"Single dice", rows:[["Single 1","single1"],["Single 5","single5"]]},
  {title:"Three of a kind", rows:[["Three 1s","t1"],["Three 2s","t2"],["Three 3s","t3"],["Three 4s","t4"],["Three 5s","t5"],["Three 6s","t6"]]},
  {title:"Four, five & six of a kind", special:"nk"},
  {title:"Six-dice combinations", rows:[["Straight 1–6","straight","straightOn"],["Three pairs","threePairs","threePairsOn"],["Two triplets","twoTriplets","twoTripletsOn"],["Four of a kind + pair","fourPair","fourPairOn"]]},
  {title:"Other combinations", rows:[["Full house (AAABB)","fullHouse","fullHouseOn"]]},
  {title:"Game rules", rows:[["Opening minimum to get on the board","openMin","openMinOn"],["Three busts in a row: penalty","penalty","penaltyOn"]]}
];
function numRow(label,key,toggle){
  const on = toggle ? cfg[toggle] : true;
  return `<div class="srow ${on?"":"off"}">
    ${toggle ? `<label class="check"><input type="checkbox" data-toggle="${toggle}" ${on?"checked":""}><span>${label}</span></label>` : `<span>${label}</span>`}
    <input class="field" type="number" min="0" step="${key[0]==="m"?1:50}" data-key="${key}" value="${cfg[key]}">
  </div>`;
}
function buildSettings(){
  $("settingsGrid").innerHTML = SECTIONS.map(s=>{
    let body;
    if (s.special==="nk"){
      const dbl = cfg.nkMode==="double";
      body = `<div class="radioRow">
          <label><input type="radio" name="nk" value="double" ${dbl?"checked":""}> Multiply three-of-a-kind</label>
          <label><input type="radio" name="nk" value="flat" ${dbl?"":"checked"}> Fixed scores</label></div>`
        + (dbl
          ? numRow("Four of a kind: × three-of-a-kind","m4") + numRow("Five of a kind: ×","m5") + numRow("Six of a kind: ×","m6")
            + `<div class="note">e.g. four 4s = ${fmt(cfg.t4)} × ${cfg.m4} = ${fmt(cfg.t4*cfg.m4)}</div>`
          : numRow("Four of a kind","f4") + numRow("Five of a kind","f5") + numRow("Six of a kind","f6"));
    } else body = s.rows.map(r=>numRow(r[0],r[1],r[2])).join("");
    return `<div class="sec"><h3>${s.title}</h3>${body}</div>`;
  }).join("");
}
$("settingsGrid").addEventListener("change", e=>{
  const t = e.target;
  if (t.dataset.key){ const v = Math.max(0, Math.round(+t.value||0)); cfg[t.dataset.key]=v; t.value=v; }
  if (t.dataset.toggle){ cfg[t.dataset.toggle]=t.checked; }
  if (t.name==="nk"){ cfg.nkMode=t.value; }
  save(); buildSettings(); syncTitle();
});
$("settingsBtn").addEventListener("click", ()=>{ buildSettings(); $("settingsOverlay").classList.add("show"); });
$("closeSettings").addEventListener("click", ()=>$("settingsOverlay").classList.remove("show"));
$("resetSettings").addEventListener("click", ()=>{
  if (!confirm("Reset all scores and rules to the defaults?")) return;
  const keep = {teams:cfg.teams, names:cfg.names, target:cfg.target, ai:cfg.ai, aiLevel:cfg.aiLevel};
  cfg = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), keep);
  save(); buildSettings(); syncTitle();
});

/* =================== RULES OVERLAY =================== */

  [1,2,3,4,5,6].forEach(v=>rows.push(["Three "+v+"s", cfg["t"+v]]));

    rows.push(["Four of a kind","× "+cfg.m4],["Five of a kind","× "+cfg.m5],["Six of a kind","× "+cfg.m6]);

  const tbl = `<table class="rulesTable">${rows.map(r=>`<tr><td>${r[0]}</td><td>${typeof r[1]==="number"?fmt(r[1]):r[1]}</td></tr>`).join("")}</table>`;
  const nkNote = cfg.nkMode==="double" ? "<p style='font-size:.8em;color:var(--chalk-dim)'>Four/five/six of a kind multiply the three-of-a-kind score.</p>" : "";

    <li>If a roll has nothing that scores, you go <b>BUST</b>: you lose this turn's points.</li>
    <li><b>Hot dice:</b> lock all six and you roll all six again, keeping your turn total.</li>
    ${cfg.openMinOn ? `<li>Your first bank must be at least <b>${fmt(cfg.openMin)}</b>.</li>` : ""}
    ${cfg.penaltyOn ? `<li>Three busts in a row costs <b>${fmt(cfg.penalty)}</b> points.</li>` : ""}
    <li>When a team reaches <b>${fmt(cfg.target)}</b>, every other team gets one <b>final turn</b>. Highest score wins.</li>

$("rulesBtn").addEventListener("click", ()=>{ $("rulesBody").innerHTML = rulesHTML(); $("rulesOverlay").classList.add("show"); });
$("closeRules").addEventListener("click", ()=>$("rulesOverlay").classList.remove("show"));

/* =================== GAME STATE =================== */
const G = { teams:[], cur:0, turn:0, rolled:[], sel:new Set(), groups:[], phase:"idle",
            finalRound:false, finalQueue:[], triggerTeam:-1, tok:0 };

function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active", s.id===id)); }

function startGame(){
  [...$("names").querySelectorAll("input.nm")].forEach((i,k)=>cfg.names[k]=i.value.trim()||("Team "+"ABCDEF"[k]));
  cfg.teams = +$("teamCount").value; cfg.target = +$("target").value; cfg.aiLevel = $("aiLevel").value; save();
  const nAI = cfg.ai.slice(0,cfg.teams).filter(Boolean).length; let aiN = 0;
  G.teams = Array.from({length:cfg.teams}, (_,i)=>{
    const ai = !!cfg.ai[i]; let name = cfg.names[i];
    if (ai && name==="Team "+"ABCDEF"[i]) name = nAI>1 ? "Computer "+(++aiN) : "Computer";
    return {name, score:0, onBoard:!cfg.openMinOn, busts:0, colour:TEAM_COLOURS[i], ai};
  });
  G.cur = 0; G.finalRound = false; G.finalQueue = []; G.triggerTeam = -1;
  G.tok++; G.phase = "idle";
  if (nAI) bustProbs();
  buildScoreboard();
  show("game");
  newTurn();
}
$("startBtn").addEventListener("click", startGame);

function buildScoreboard(){
  const sb = $("scoreboard"); sb.innerHTML = "";
  G.teams.forEach((t,i)=>{
    const d = document.createElement("div");
    d.className = "team"; d.id = "team"+i; d.style.setProperty("--tc", t.colour);
    d.innerHTML = `<div class="row"><div class="name">${escapeHTML(t.name)}</div><div class="score" id="score${i}">0</div></div>
      <div class="bar"><i id="bar${i}"></i></div><div class="tag" id="tag${i}"></div>`;
    sb.appendChild(d);
    if (i===0 && G.teams.length===2){
      const c = document.createElement("div"); c.className="centreInfo";
      c.innerHTML = `<div class="t1">🎲 10,000</div><div class="t2">First to ${fmt(cfg.target)}</div>`;
      sb.appendChild(c);
    }
  });
  renderScores();
}
function escapeHTML(s){ return s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function renderScores(){
  G.teams.forEach((t,i)=>{
    $("score"+i).textContent = fmt(t.score);
    $("bar"+i).style.width = Math.min(100, t.score/cfg.target*100)+"%";
    let tag = "";
    if (!t.onBoard) tag = "Not on the board yet";
    else if (cfg.penaltyOn && t.busts>0) tag = "Busts in a row: " + t.busts;
    if (G.finalRound && i===G.triggerTeam) tag = "Reached " + fmt(cfg.target) + "!";
    if (!tag && G.teams[i].ai) tag = "🤖 Computer · " + cfg.aiLevel;
    if (G.teams.length>2 && !tag) tag = "First to " + fmt(cfg.target);
    $("tag"+i).textContent = tag;
    $("team"+i).classList.toggle("active", i===G.cur);
  });
}

function newTurn(){
  hideCombos();
  G.turn = 0; G.rolled = []; G.sel.clear(); G.groups = []; G.phase = "start";
  const t = G.teams[G.cur];
  renderScores();
  const lbl = $("turnLabel");
  lbl.classList.remove("final"); lbl.style.color = t.colour;
  if (G.finalRound){
    const best = Math.max(...G.teams.map(x=>x.score));
    lbl.textContent = t.name + "'s FINAL turn: beat " + fmt(best) + "!";
    void lbl.offsetWidth; lbl.classList.add("final"); lbl.style.color = "var(--bad)";
  } else lbl.textContent = t.name + "'s turn";
  drawDice(6, true);
  setMessage(!t.onBoard ? "Need " + fmt(cfg.openMin) + " in one turn to get on the board" : "", !t.onBoard ? "warn" : "");
  $("turnTotal").textContent = "0"; $("selTotal").textContent = "–";
  renderTray();
  $("rollBtn").textContent = "🎲 Roll 6 dice";
  setButtons({roll:true});
  $("bestBtn").disabled = true;
  if (t.ai){ setButtons({}); later(()=>roll(true), 1100); }
}

function setButtons({roll=false,bank=false,next=false}){
  $("rollBtn").classList.toggle("hidden",!roll);
  $("bankBtn").classList.toggle("hidden",!bank);
  $("nextBtn").classList.toggle("hidden",!next);
  $("rollBtn").disabled = $("bankBtn").disabled = $("nextBtn").disabled = false;
}
function setMessage(text, cls){
  const m = $("message"); m.className = "message"; void m.offsetWidth;
  if (cls) m.classList.add(cls); m.textContent = text;
}

function drawDice(n, ghost){
  const row = $("diceRow"); row.innerHTML = "";
  for (let i=0;i<n;i++){
    const d = makeDie(); showFace(d, ghost ? 6 : (G.rolled[i]||6));
    if (ghost) d.classList.add("ghost");
    d.dataset.i = i;
    row.appendChild(d);
  }
}

function renderTray(){
  const tr = $("tray"); tr.innerHTML = "";
  G.groups.forEach(g=>{
    const el = document.createElement("div"); el.className="group";
    g.dice.forEach(v=>{ const d=makeDie(true); showFace(d,v); el.appendChild(d); });
    const b = document.createElement("b"); b.textContent = "+" + fmt(g.pts); el.appendChild(b);
    el.title = g.desc;
    tr.appendChild(el);
  });
}

/* ---------- Rolling ---------- */
function roll(viaAI){
  if (isAI() && viaAI!==true) return;
  if (G.phase==="start"){ doRoll(6); return; }
  if (G.phase!=="choose") return;
  const res = currentSelection();
  if (!res.valid) return;
  lockSelection(res);
  const left = G.rolled.length - res.count;
  if (left===0){
    setMessage("🔥 Hot dice! Roll all six again", "good"); sfx.hot();
    setTimeout(()=>{ if (G.phase==="locking") doRoll(6); }, 900);
    G.phase = "locking"; setButtonsDisabled(); return;
  }
  doRoll(left);
}
function setButtonsDisabled(){ $("rollBtn").disabled = $("bankBtn").disabled = true; $("bestBtn").disabled = true; }

function lockSelection(res){
  hideCombos();
  const dice = [...G.sel].sort((a,b)=>a-b).map(i=>G.rolled[i]);
  G.groups.push({dice, pts:res.pts, desc:res.desc});
  G.turn += res.pts;
  G.sel.clear();
  renderTray();
  const tt = $("turnTotal"); tt.textContent = fmt(G.turn); tt.classList.add("pop"); setTimeout(()=>tt.classList.remove("pop"),200);
  $("selTotal").textContent = "–";
}

function doRoll(n){
  hideCombos();
  G.phase = "rolling"; setButtonsDisabled();
  setMessage("", "");
  G.rolled = Array.from({length:n}, rnd);
  drawDice(n, false);
  const dice = [...$("diceRow").children];
  dice.forEach(d=>d.classList.add("rolling"));
  let f = 0;
  const flick = () => {
    f++;
    dice.forEach(d=>showFace(d, rnd())); sfx.tick();
    if (f < 14) setTimeout(flick, 40 + f*6);
    else {
      dice.forEach((d,i)=>{ d.classList.remove("rolling"); showFace(d, G.rolled[i]); void d.offsetWidth; d.classList.add("land"); });
      if (G.phase==="over") return;
      afterRoll();
    }
  };
  flick();
}

function afterRoll(){
  const best = bestSubset(G.rolled);
  if (best.pts===0) return goBust();
  G.phase = "choose";
  if (isAI()){ later(aiPlan, 900); return; }
  [...$("diceRow").children].forEach((d,i)=>{
    d.classList.add("pickable");
    const k = document.createElement("div"); k.className="key"; k.textContent = i+1; d.appendChild(k);
  });
  $("bestBtn").disabled = false;
  updateSelection();
}

$("diceRow").addEventListener("click", e=>{
  const d = e.target.closest(".die"); if (!d) return;
  toggleDie(+d.dataset.i);
});
function toggleDie(i){
  if (isAI() || G.phase!=="choose" || i>=G.rolled.length) return;
  G.sel.has(i) ? G.sel.delete(i) : G.sel.add(i);
  sfx.pick();
  updateSelection();
}
function selectBest(){
  if (isAI() || G.phase!=="choose") return;
  const b = bestSubset(G.rolled);
  G.sel.clear();
  G.rolled.forEach((_,i)=>{ if (b.mask & (1<<i)) G.sel.add(i); });
  sfx.pick(); updateSelection();
}

function currentSelection(){
  const vals = [...G.sel].map(i=>G.rolled[i]);
  if (!vals.length) return {valid:false, empty:true, count:0};
  const r = scoreDice(vals);
  if (!r) return {valid:false, count:vals.length};
  return {valid:true, pts:r.pts, desc:describe(r.parts), count:vals.length};
}

function updateSelection(){
  renderCombos();
  [...$("diceRow").children].forEach((d,i)=>d.classList.toggle("sel", G.sel.has(i)));
  const res = currentSelection(), t = G.teams[G.cur];
  const left = G.rolled.length - res.count;
  if (res.empty){
    setMessage("Tap the dice you want to lock", "dim");
    $("selTotal").textContent = "–";
  } else if (!res.valid){
    setMessage("Not all of those dice score", "warn");
    $("selTotal").textContent = "✗";
  } else {
    setMessage(res.desc, "good");
    $("selTotal").textContent = "+" + fmt(res.pts);
  }
  const bankTotal = G.turn + (res.valid ? res.pts : 0);
  const canBank = res.valid && (t.onBoard || bankTotal >= cfg.openMin);
  $("rollBtn").textContent = !res.valid ? "🎲 Lock & roll" : left===0 ? "🔥 Lock & roll 6" : "🎲 Lock & roll " + left;
  $("bankBtn").innerHTML = SAFE + " Bank " + fmt(bankTotal);
  setButtons({roll:true, bank:true});
  $("rollBtn").disabled = !res.valid;
  $("bankBtn").disabled = !canBank;
  if (res.valid && !t.onBoard && !canBank)
    setMessage(res.desc + "  (need " + fmt(cfg.openMin) + " to bank)", "warn");
  if (res.valid && G.finalRound){
    const need = Math.max(...G.teams.map((x,i)=>i===G.cur?0:x.score)) - t.score + 1;
    if (bankTotal >= need) setMessage(res.desc + "  —  Bank now to win! 🏆", "good");
  } else if (res.valid && !G.finalRound && t.score + bankTotal >= cfg.target){
    setMessage(res.desc + "  —  Bank now to reach " + fmt(cfg.target) + "!", "good");
  }
}

function goBust(){
  hideCombos();
  G.phase = "bust";
  const t = G.teams[G.cur];
  G.turn = 0; $("turnTotal").textContent = "0"; $("selTotal").textContent = "–";
  t.busts++;
  let msg = "BUST!";
  sfx.bad();
  setMessage(msg, "bad");
  if (cfg.penaltyOn && t.busts >= 3){
    const lost = Math.min(cfg.penalty, t.score);
    t.busts = 0;
    setTimeout(()=>{
      setMessage("Third bust in a row: lose " + fmt(cfg.penalty), "bad");
      countTo(G.cur, t.score - lost);
    }, 900);
  }
  renderScores();
  setButtons({next:true});
  $("nextBtn").textContent = nextLabel();
  $("bestBtn").disabled = true;
  if (t.ai){ setButtons({}); later(advance, cfg.penaltyOn ? 2600 : 1900); }
}
function nextLabel(){ return (G.finalRound && G.finalQueue.length===0) ? "See result ➜" : "Next team ➜"; }

function bank(viaAI){
  if (G.phase!=="choose") return;
  if (isAI() && viaAI!==true) return;
  const res = currentSelection(); if (!res.valid) return;
  const t = G.teams[G.cur];
  if (!t.onBoard && G.turn + res.pts < cfg.openMin) return;
  lockSelection(res);
  G.phase = "banking"; setButtonsDisabled();
  sfx.bank();
  setMessage("Banked " + fmt(G.turn) + "!", "good");
  t.onBoard = true; t.busts = 0;
  countTo(G.cur, t.score + G.turn, ()=>{
    if (G.phase==="over") return;
    if (!G.finalRound && t.score >= cfg.target){
      G.finalRound = true; G.triggerTeam = G.cur;
      G.finalQueue = [];
      for (let k=1;k<G.teams.length;k++) G.finalQueue.push((G.cur+k)%G.teams.length);
      setMessage(t.name + " reached " + fmt(cfg.target) + "! Final round…", "good");
      setTimeout(advance, 1400);
      return;
    }
    advance();
  });
}

function countTo(i, value, done){
  const t = G.teams[i], start = t.score, el = $("score"+i);
  t.score = value;
  const steps = Math.min(25, Math.abs(value-start)) || 1;
  let k = 0; el.classList.add("bump");
  $("bar"+i).style.width = Math.min(100, value/cfg.target*100)+"%";
  const step = () => {
    k++; el.textContent = fmt(Math.round(start + (value-start)*k/steps));
    if (k<steps) setTimeout(step, 30);
    else { el.classList.remove("bump"); renderScores(); done && setTimeout(done, 400); }
  };
  step();
}

function advance(){
  if (G.phase==="over") return;
  if (G.finalRound){
    if (!G.finalQueue.length) return declareResult("final");
    G.cur = G.finalQueue.shift();
  } else G.cur = (G.cur+1) % G.teams.length;
  newTurn();
}
function nextTeam(){ if (G.phase==="bust" && !isAI()) advance(); }

/* ---------- Result ---------- */
function declareResult(reason){
  G.phase = "over";
  const top = Math.max(...G.teams.map(t=>t.score));
  const winners = G.teams.filter(t=>t.score===top);
  sfx.win();
  const title = $("winTitle");
  if (winners.length>1){ title.textContent = "🤝 It's a draw!"; title.style.color = "var(--chalk)"; }
  else { title.textContent = "🏆 " + winners[0].name + " wins!"; title.style.color = winners[0].colour; }
  $("winNote").textContent = reason==="early" ? "Game ended early: most banked points wins." : "";
  const sorted = [...G.teams].sort((a,b)=>b.score-a.score);
  $("resultTable").innerHTML = sorted.map(t=>`<tr><td style="color:${t.colour}">${escapeHTML(t.name)}</td><td>${fmt(t.score)}</td></tr>`).join("");
  $("winOverlay").classList.add("show");
  confetti();
}

/* ---------- Confetti ---------- */
function confetti(){
  const c=$("confetti"), ctx=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const bits = Array.from({length:180}, ()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:8+Math.random()*8,h:5+Math.random()*6,col:TEAM_COLOURS[Math.random()*6|0]}));
  let f=0;
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    bits.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.vy+=.04; b.r+=b.vr; ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r); ctx.fillStyle=b.col; ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h); ctx.restore(); });
    if (++f<260) requestAnimationFrame(draw); else ctx.clearRect(0,0,c.width,c.height);
  })();
}

/* =================== COMPUTER PLAYERS =================== */
const isAI = () => !!(G.teams[G.cur] && G.teams[G.cur].ai);
function later(fn, ms){ const t=G.tok; setTimeout(()=>{ if (t===G.tok && G.phase!=="over") fn(); }, ms); }

// Chance of busting when rolling n dice, worked out exactly from the current scoring rules.
let bustCache = {key:"", p:null};
function hasScore(vals){
  for (let m=1; m<(1<<vals.length); m++){
    const r = scoreDice(vals.filter((_,i)=>m&(1<<i)));
    if (r && r.pts>0) return true;
  }
  return false;
}
function bustProbs(){
  const key = JSON.stringify(Object.assign({}, cfg, {names:0, ai:0, aiLevel:0, teams:0, target:0, openMin:0, openMinOn:0, penalty:0, penaltyOn:0}));
  if (bustCache.key===key) return bustCache.p;
  const fact=[1,1,2,6,24,120,720], p=[0];
  for (let n=1;n<=6;n++){
    let bust = 0;
    (function rec(face,left,vals,den){
      if (face===7){ if (left===0 && !hasScore(vals)) bust += fact[n]/den; return; }
      for (let c=0;c<=left;c++) rec(face+1, left-c, vals.concat(Array(c).fill(face)), den*fact[c]);
    })(1,n,[],1);
    p[n] = bust/Math.pow(6,n);
  }
  bustCache = {key, p};
  return p;
}
// Typical extra points a roll is worth when it doesn't bust (includes the hot-dice bonus), by dice left.
const AI_G = [0,600,240,155,185,170,120];

function aiPlan(){
  if (G.phase!=="choose" || !isAI()) return;
  const t = G.teams[G.cur], lvl = cfg.aiLevel, n = G.rolled.length, bp = bustProbs();
  const bestOther = Math.max(...G.teams.filter((_,i)=>i!==G.cur).map(x=>x.score));
  const need = bestOther - t.score + 1;                 // needed in the final round
  let f = 1;                                            // appetite for risk
  if (lvl==="medium") f = 0.85 + Math.random()*0.3;
  if (lvl==="hard") f = 1 + Math.max(-0.2, Math.min(0.3, (bestOther - t.score)/cfg.target));

  // Value of locking dice to reach turn total T with k dice left, and whether to bank there.
  const pos = (T,k) => {
    const kk = k===0 ? 6 : k;
    const cont = (1-bp[kk])*(T+AI_G[kk])*f;
    const can = t.onBoard || T>=cfg.openMin;
    if (G.finalRound){
      if (can && T>=need) return {bank:true, v:1e6+T};
      return {bank:false, v:cont};                      // must keep going to win
    }
    if (can && t.score+T>=cfg.target) return {bank:true, v:1e6+T};
    if (lvl==="easy") return {bank: can && k>0 && T>=250+Math.random()*250, v:T};
    const bank = can && T>=cont;
    return {bank, v: bank ? T : cont};
  };

  let pick = null;
  const greedy = bestSubset(G.rolled);
  if (lvl==="easy" || (lvl==="medium" && Math.random()<0.3)){
    pick = {mask:greedy.mask, pts:greedy.pts};          // grab the most points
  } else {
    let bestV = -1, bestK = -1;
    for (let m=1; m<(1<<n); m++){
      const r = scoreDice(G.rolled.filter((_,i)=>m&(1<<i)));
      if (!r || r.pts<=0) continue;
      const k = n - popcount(m), v = pos(G.turn+r.pts, k).v;
      if (v>bestV+1e-9 || (Math.abs(v-bestV)<1e-9 && k>bestK)){ bestV=v; bestK=k; pick={mask:m, pts:r.pts}; }
    }
  }
  if (!pick) pick = {mask:greedy.mask, pts:greedy.pts};
  const d = pos(G.turn+pick.pts, n-popcount(pick.mask));

  G.sel = new Set();
  G.rolled.forEach((_,i)=>{ if (pick.mask & (1<<i)) G.sel.add(i); });
  sfx.pick(); updateSelection();
  setButtons({}); $("bestBtn").disabled = true;
  later(()=>{ if (d.bank) bank(true); else roll(true); }, 1200);
}

/* =================== COMBO LIST =================== */
let showCombos = false;
try{ showCombos = localStorage.getItem("tenk-combos")==="1"; }catch(e){}
function hideCombos(){ $("combos").classList.add("hidden"); $("combos").innerHTML = ""; }
// Every scoring combination available in the current throw, as {mask, pts, label, dice}
function comboList(){
  const rolled = G.rolled, c = countsOf(rolled), seen = new Map();
  const add = (mask) => {
    if (!mask || seen.has(mask)) return;
    const vals = rolled.filter((_,i)=>mask & (1<<i));
    const r = scoreDice(vals);
    if (!r || r.pts<=0) return;
    seen.set(mask, {mask, pts:r.pts, label:describe(r.parts), dice:vals});
  };
  const maskFor = use => {
    let m = 0;
    for (let v=1; v<=6; v++){
      let need = use[v];
      for (let i=0; i<rolled.length && need>0; i++) if (rolled[i]===v){ m |= 1<<i; need--; }
    }
    return m;
  };
  patternsFor(c).forEach(p=>add(maskFor(p.use)));
  [1,5].forEach(v=>{ for (let n=2; n<=c[v]; n++){ const u=[0,0,0,0,0,0,0]; u[v]=n; add(maskFor(u)); } });
  const best = bestSubset(rolled);
  if (best.pts>0) add(best.mask);                     // everything that scores, together
  return [...seen.values()].sort((a,b)=>b.pts-a.pts || popcount(a.mask)-popcount(b.mask));
}
function renderCombos(){
  const box = $("combos");
  if (!showCombos || G.phase!=="choose" || isAI()){ hideCombos(); return; }
  const list = comboList();
  box.innerHTML = "";
  list.forEach(cb=>{
    const el = document.createElement("button");
    el.className = "combo" + (G.sel.size && [...Array(G.rolled.length).keys()].every(i=>!(cb.mask&(1<<i)) || G.sel.has(i)) ? " on" : "");
    el.dataset.mask = cb.mask;
    const g = document.createElement("span"); g.className = "dgrp";
    cb.dice.forEach(v=>{ const d=makeDie(true); showFace(d,v); g.appendChild(d); });
    const t = document.createElement("span"); t.textContent = cb.label;
    const b = document.createElement("b"); b.textContent = "+" + fmt(cb.pts);
    el.append(g, t, b); box.appendChild(el);
  });
  box.classList.toggle("hidden", !list.length);
}
// Tapping a combo selects its dice, exactly as if you had tapped them; tap again to un-select.
$("combos").addEventListener("click", e=>{
  const el = e.target.closest(".combo"); if (!el || isAI() || G.phase!=="choose") return;
  const mask = +el.dataset.mask, idx = [];
  for (let i=0;i<G.rolled.length;i++) if (mask & (1<<i)) idx.push(i);
  if (idx.every(i=>G.sel.has(i))) idx.forEach(i=>G.sel.delete(i)); else idx.forEach(i=>G.sel.add(i));
  sfx.pick(); updateSelection();
});
function toggleCombos(){
  showCombos = !showCombos;
  try{ localStorage.setItem("tenk-combos", showCombos?"1":"0"); }catch(e){}
  syncCombosBtn();
  if (G.phase==="choose") updateSelection(); else hideCombos();
}
function syncCombosBtn(){
  $("combosBtn").innerHTML = '<span class="ic">📋</span><span class="tx"> Combos: ' + (showCombos ? "on" : "off") + "</span>"; $("combosBtn").classList.toggle("on", showCombos);
  $("game").classList.toggle("combosOn", showCombos);
}
syncCombosBtn();

/* =================== WIRING =================== */
const SAFE = `<svg class="safe" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11V9a5 5 0 0 1 5-5h8a5 5 0 0 1 5 5v2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><rect x="3" y="11" width="18" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.5 4.2V20M16.5 4.2V20" stroke="currentColor" stroke-width="1.4"/><rect x="10.3" y="9.2" width="3.4" height="4.8" rx=".8" fill="currentColor"/></svg>`;
$("rollBtn").addEventListener("click", roll);
$("bankBtn").addEventListener("click", bank);
$("nextBtn").addEventListener("click", nextTeam);
$("bestBtn").addEventListener("click", selectBest);
$("combosBtn").addEventListener("click", toggleCombos);
$("menuBtn").addEventListener("click", ()=>{ if (confirm("Leave this game and return to the menu?")){ G.phase="over"; G.tok++; syncTitle(); show("menu"); } });
$("endBtn").addEventListener("click", ()=>{ if (G.phase!=="over" && confirm("End the game now? The team with the most banked points wins.")) declareResult("early"); });
$("againBtn").addEventListener("click", ()=>{ $("winOverlay").classList.remove("show"); startGame(); });
$("winMenuBtn").addEventListener("click", ()=>{ $("winOverlay").classList.remove("show"); syncTitle(); show("menu"); });
$("soundBtn").addEventListener("click", ()=>{ soundOn=!soundOn; $("soundBtn").innerHTML = soundOn ? '<span class="ic">🔊</span><span class="tx"> Sound on</span>' : '<span class="ic">🔇</span><span class="tx"> Sound off</span>'; });

// Keyboard: 1–6 pick dice, R/Space roll, B bank, N/Enter next team, S select best
document.addEventListener("keydown", e=>{
  if (!$("game").classList.contains("active") || e.target.tagName==="INPUT") return;
  if (document.querySelector(".overlay.show")) return;
  const k = e.key.toLowerCase();
  if (k>="1" && k<="6") toggleDie(+k-1);
  else if (k===" " || k==="r"){ e.preventDefault(); roll(); }
  else if (k==="b") bank();
  else if (k==="s") selectBest();
  else if (k==="c") toggleCombos();
  else if (k==="n" || k==="enter") nextTeam();
});

}catch(e){}
})();
</script>
